name: Audit monster data

on:
  push:
    branches: [main]
    paths:
      - 'assets/client-monsters-data.js'
      - 'assets/client-monster-disable-legacy-maps.js'
      - 'assets/client-monster-identity.js'
      - 'assets/client-monster-navigation-current.js'
      - 'assets/client-monster-roster.js'
      - 'assets/monster-roster-classification.js'
      - 'assets/monster-verified-skill-associations.js'
      - 'assets/monster-zero-stats.js'
      - 'assets/monster-zero-consensus.js'
      - 'assets/client-monsters.js'
      - 'assets/monster-client-corrections.js'
      - 'assets/monster-audit-20260909.js'
      - 'assets/client-monster-current-overlay.js'
      - 'assets/monster-instance-maps.js'
      - 'assets/monster-strict-verification.js'
      - 'assets/item-monster-drops.js'
      - '.github/scripts/enforce_strict_monster_verification.py'
      - '.github/scripts/audit_strict_monster_runtime.js'
      - '.github/scripts/debug_monster_nav.js'
      - '.github/workflows/audit-monster-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Re-apply strict verification policy
        run: python .github/scripts/enforce_strict_monster_verification.py

      - name: Check current-client Navi invariants
        run: node .github/scripts/debug_monster_nav.js

      - name: Audit strict verified runtime
        run: node .github/scripts/audit_strict_monster_runtime.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-strict-audit
          path: audit/
