name: Audit monster data

on:
  push:
    branches: [main]
    paths:
      - 'assets/client-monsters-data.js'
      - 'assets/client-monster-disable-legacy-maps.js'
      - 'assets/client-monster-identity.js'
      - 'assets/client-monster-navigation-current.js'
      - 'assets/client-monster-roster.js'
      - 'assets/monster-roster-classification.js'
      - 'assets/monster-verified-skill-associations.js'
      - 'assets/monster-zero-stats.js'
      - 'assets/monster-zero-consensus.js'
      - 'assets/rms-monster-behavior.js'
      - 'assets/client-monsters.js'
      - 'assets/monster-client-corrections.js'
      - 'assets/monster-audit-20260909.js'
      - 'assets/client-monster-current-overlay.js'
      - 'assets/monster-instance-maps.js'
      - '.github/scripts/audit_monster_completeness.js'
      - '.github/scripts/refine_monster_classification.js'
      - '.github/scripts/debug_monster_nav.js'
      - '.github/workflows/audit-monster-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write navigation diagnostics
        run: node .github/scripts/debug_monster_nav.js
      - name: Build audit and run navigation regressions
        run: node .github/scripts/audit_monster_completeness.js
      - name: Apply conservative classification overrides
        run: node .github/scripts/refine_monster_classification.js
      - name: Count verification provenance tiers
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const path=require('path');
          const sandbox={console,setTimeout,clearTimeout};
          sandbox.window=sandbox;
          sandbox.globalThis=sandbox;
          sandbox.RO_DATA={monsters:[],items:[],maps:[]};
          const ctx=vm.createContext(sandbox);
          const files=[
            'assets/client-monsters-data.js',
            'assets/client-monster-disable-legacy-maps.js',
            'assets/client-monster-identity.js',
            'assets/client-monster-navigation-current.js',
            'assets/client-monster-roster.js',
            'assets/monster-zero-stats.js',
            'assets/monster-zero-consensus.js',
            'assets/rms-monster-behavior.js',
            'assets/client-monsters.js',
            'assets/monster-client-corrections.js',
            'assets/monster-audit-20260909.js',
            'assets/client-monster-current-overlay.js',
            'assets/monster-verified-skill-associations.js',
            'assets/monster-instance-maps.js'
          ];
          for(const rel of files){
            vm.runInContext(fs.readFileSync(path.resolve(rel),'utf8'),ctx,{filename:rel});
          }
          const roster=Array.isArray(sandbox.RZ_CLIENT_MONSTER_ROSTER)?sandbox.RZ_CLIENT_MONSTER_ROSTER:[];
          const monsters=Array.isArray(sandbox.RO_DATA?.monsters)?sandbox.RO_DATA.monsters:[];
          const zeroStats=sandbox.RZ_MONSTER_ZERO_STATS||{};
          const consensus=sandbox.RZ_MONSTER_ZERO_CONSENSUS||{};
          const skillAssoc=sandbox.RZ_MONSTER_VERIFIED_SKILL_ASSOCIATIONS||{};
          const byId=new Map(monsters.map(m=>[Number(m?.clientId??m?.id),m]));
          if(roster.length!==598) throw new Error(`Expected 598 roster identities, got ${roster.length}`);

          const client=[];
          const external=[];
          const unverified=[];
          const externalEvidenceCounts={ragnadexVerified:0,twrozOrProntera:0,zeroSpawn:0,verifiedSkillAssociation:0};
          for(const row of roster){
            const id=Number(row?.[0]);
            const internalName=String(row?.[1]||'');
            const monster=byId.get(id);
            if(monster?.clientNavigationCurrent===true){
              client.push({id,internalName,name:monster?.name||internalName});
              continue;
            }
            const key=String(id);
            const c=consensus[key]||{};
            const availability=c.sourceAvailability||{};
            const hasRagnaDexVerified=!!zeroStats[key] && Object.keys(zeroStats[key]).length>0;
            const hasTwrozOrProntera=availability.TWRoZ===true || availability.Prontera===true;
            const hasZeroSpawn=Array.isArray(monster?.maps) && monster.maps.some(x=>String(x?.source||'').startsWith('zero-'));
            const hasVerifiedSkill=Array.isArray(skillAssoc[key]) && skillAssoc[key].some(x=>x?.associationVerified===true);
            const isExternal=hasRagnaDexVerified||hasTwrozOrProntera||hasZeroSpawn||hasVerifiedSkill;
            if(isExternal){
              external.push({id,internalName,name:monster?.name||internalName,evidence:{ragnadexVerified:hasRagnaDexVerified,twrozOrProntera:hasTwrozOrProntera,zeroSpawn:hasZeroSpawn,verifiedSkillAssociation:hasVerifiedSkill}});
              if(hasRagnaDexVerified) externalEvidenceCounts.ragnadexVerified++;
              if(hasTwrozOrProntera) externalEvidenceCounts.twrozOrProntera++;
              if(hasZeroSpawn) externalEvidenceCounts.zeroSpawn++;
              if(hasVerifiedSkill) externalEvidenceCounts.verifiedSkillAssociation++;
            }else{
              unverified.push({id,internalName,name:monster?.name||internalName});
            }
          }
          const result={
            roster:roster.length,
            clientVerifiedExactNavi:client.length,
            externallyVerifiedZero:external.length,
            notYetVerified:unverified.length,
            total:client.length+external.length+unverified.length,
            externalEvidenceCounts,
            definitions:{
              client:'Current client identity + sprite + exact internal-name match in current Navi.',
              external:'No exact current Navi match, but at least one Zero-specific external proof: RagnaDex zero_felder, TWRoZ/Prontera resolved page, Zero spawn, or explicitly verified Zero skill association.',
              unverified:'Present in current client identity/sprite roster, but no exact current Navi match and no qualifying external Zero proof yet.'
            },
            unverified
          };
          if(result.total!==598) throw new Error(`Tier total mismatch: ${result.total}`);
          fs.mkdirSync('audit',{recursive:true});
          fs.writeFileSync('audit/monster-verification-tiers.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: List normal monsters missing maps
        run: |
          node - <<'NODE'
          const audit=require('./audit/monster-data-audit.json');
          const rows=(audit.incomplete||[]).filter(x=>x.category==='normal'&&(x.missing||[]).includes('Maps'));
          console.log(JSON.stringify({count:rows.length,monsters:rows.map(x=>({id:x.id,internalName:x.internalName,name:x.name,missing:x.missing}))},null,2));
          NODE
      - name: List normal monsters missing core stats
        run: |
          node - <<'NODE'
          const audit=require('./audit/monster-data-audit.json');
          const core=new Set(['HP','ATK','MATK','DEF','MDEF','HIT','FLEE']);
          const rows=(audit.incomplete||[]).filter(x=>x.category==='normal'&&(x.missing||[]).some(f=>core.has(f)));
          console.log(JSON.stringify({count:rows.length,monsters:rows.map(x=>({id:x.id,internalName:x.internalName,name:x.name,missing:(x.missing||[]).filter(f=>core.has(f))}))},null,2));
          NODE
      - name: List normal monsters missing drops
        run: |
          node - <<'NODE'
          const audit=require('./audit/monster-data-audit.json');
          const rows=(audit.incomplete||[]).filter(x=>x.category==='normal'&&(x.missing||[]).includes('Drops'));
          console.log(JSON.stringify({count:rows.length,monsters:rows.map(x=>({id:x.id,internalName:x.internalName,name:x.name,missing:x.missing}))},null,2));
          NODE
      - name: List normal monsters missing skills
        run: |
          node - <<'NODE'
          const audit=require('./audit/monster-data-audit.json');
          const rows=(audit.incomplete||[]).filter(x=>x.category==='normal'&&(x.missing||[]).includes('Skills'));
          console.log(JSON.stringify({count:rows.length,monsters:rows.map(x=>({id:x.id,internalName:x.internalName,name:x.name,missing:x.missing}))},null,2));
          NODE
      - name: List normal monsters missing experience
        run: |
          node - <<'NODE'
          const audit=require('./audit/monster-data-audit.json');
          const exp=new Set(['Base EXP','Job EXP']);
          const rows=(audit.incomplete||[]).filter(x=>x.category==='normal'&&(x.missing||[]).some(f=>exp.has(f)));
          console.log(JSON.stringify({count:rows.length,monsters:rows.map(x=>({id:x.id,internalName:x.internalName,name:x.name,missing:(x.missing||[]).filter(f=>exp.has(f))}))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-data-audit
          path: audit/
