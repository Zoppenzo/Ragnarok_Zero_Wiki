name: Restore Flamberge

on:
  push:
    paths:
      - '.github/workflows/restore-flamberge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Flamberge
        run: python tools/restore_flamberge.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "[3,'Flamberge',['16 Oridecon','1 Cursed Ruby']]" in s
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restore Flamberge forging recipe"
          git push origin HEAD:main
