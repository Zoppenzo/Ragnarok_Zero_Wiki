name: Check Crafting JavaScript

on:
  push:
    paths:
      - '.github/workflows/check-crafting-js.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          assert scripts, 'No inline scripts found'
          Path('/tmp/wiki-inline.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: node --check /tmp/wiki-inline.js
