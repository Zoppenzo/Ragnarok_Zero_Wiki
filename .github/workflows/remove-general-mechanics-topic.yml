name: Remove unwanted mechanics topic

on:
  push:
    paths:
      - '.github/workflows/remove-general-mechanics-topic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove topic
        run: python tools/remove_general_mechanics_topic.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert "id:'mechanics', group:'General Topics'" not in s
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Remove Game Mechanics from General Topics"
          git push origin HEAD:main
