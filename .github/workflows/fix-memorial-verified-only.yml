name: Fix Memorial Verified Only

on:
  push:
    paths:
      - '.github/workflows/fix-memorial-verified-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python tools/fix_memorial_verified_only.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index('  function memorialDungeonData() {')
          b = s.index('\n  function statusEffectsPage', a)
          m = s[a:b]
          banned = [
            'Base Lv. 30–60','One completion per day','Une complétion par jour','blue pillars','piliers bleus',
            '[Not For Sale] Red Potion','Dungeon mechanics','Mécaniques du donjon','bonus chest','coffre bonus',
            '<th>Base EXP</th>','<th>Job EXP</th>','Monster names are internal database links',
            'Les noms des monstres sont déjà des liens internes'
          ]
          for x in banned:
            assert x not in m, x
          assert "Base Lv. 30+" in m
          assert "CD : 1 fois par jour." in m
          assert "détruis le donjon pour recevoir les récompenses" in m
          assert "memorialAccessHtml(d.access)" in m
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Correct Memorial Dungeon guide details"
          git push origin HEAD:main
