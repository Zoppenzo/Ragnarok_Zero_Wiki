name: Clean Memorial Source Mentions

on:
  push:
    paths:
      - '.github/workflows/clean-memorial-source-mentions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden cleanup replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/clean_memorial_source_mentions.py')
          s = p.read_text(encoding='utf-8')
          marker = "# Remove source-comparison arrays entirely."
          inject = """# Generic cleanup for any remaining provenance wording in the Memorial guide data.\nblock = block.replace('KRO/Criatura: ', '').replace('KRO/Criatura : ', '')\nblock = block.replace('KRO reference: ', '').replace('Référence KRO : ', '')\nblock = block.replace(' — KRO reference.', '.').replace(' — référence KRO.', '.')\nblock = block.replace('KRO Normal: ', 'Normal: ').replace('KRO Normal : ', 'Normal : ')\nblock = block.replace('KRO Hard reference pool: ', 'Hard: ').replace('Pool KRO Hard : ', 'Hard : ')\nblock = block.replace(' — Criatura Academy', '')\n\n"""
          if inject not in s:
              s = s.replace(marker, inject + marker, 1)
          s = s.replace("['crosscheck:', 'Source cross-check', 'Croisement des sources', 'KRO/Criatura', 'référence KRO', 'KRO reference', '— Criatura Academy']", "['crosscheck:', 'Source cross-check', 'Croisement des sources', 'KRO/Criatura', '— Criatura Academy']")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply memorial cleanup
        run: python tools/clean_memorial_source_mentions.py
      - name: Clean provenance from visible guide prose
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          repls = {
            "Some iRO equipment sets also grant immunity.": "Some equipment sets also grant immunity.",
            "Certains sets d’équipement iRO confèrent également l’immunité.": "Certains sets d’équipement confèrent également l’immunité.",
            "High INT reduces chance and duration; iRO lists 1% less chance per INT point.": "High INT reduces chance and duration; each INT point reduces the chance by 1%.",
            "Une INT élevée réduit la chance et la durée ; iRO indique 1 % de chance en moins par point d’INT.": "Une INT élevée réduit la chance et la durée ; chaque point d’INT réduit la chance de 1 %.",
            "Stone has two stages on iRO: at first the character can still move and use items, but cannot attack or use skills, and taking damage does not cancel the effect. Once Stone hardens, the character is immobilized and taking damage breaks the petrification.": "Stone has two stages: at first the character can still move and use items, but cannot attack or use skills, and taking damage does not cancel the effect. Once Stone hardens, the character is immobilized and taking damage breaks the petrification.",
            "Sur iRO, Stone possède deux phases : au début, le personnage peut encore se déplacer et utiliser des objets, mais ne peut plus attaquer ni utiliser de compétences, et recevoir des dégâts ne retire pas l’effet. Une fois Stone durci, le personnage est immobilisé et recevoir des dégâts brise la pétrification.": "Stone possède deux phases : au début, le personnage peut encore se déplacer et utiliser des objets, mais ne peut plus attaquer ni utiliser de compétences, et recevoir des dégâts ne retire pas l’effet. Une fois Stone durci, le personnage est immobilisé et recevoir des dégâts brise la pétrification.",
            "Expanded class skills (Heel Drop, Roundhouse, Estun, Cracker), Homunculus skills and Flame Skull Card are also listed by iRO.": "Expanded class skills (Heel Drop, Roundhouse, Estun, Cracker), Homunculus skills and Flame Skull Card can also cause Stun.",
            "iRO liste aussi les compétences Expanded (Heel Drop, Roundhouse, Estun, Cracker), des compétences d’Homunculus et Flame Skull Card.": "Les compétences Expanded (Heel Drop, Roundhouse, Estun, Cracker), certaines compétences d’Homunculus et Flame Skull Card peuvent aussi provoquer Stun.",
            "${navLabel('iRO note','Note iRO')}": "${navLabel('Note','Note')}",
            "The effects, causes, prevention methods and recovery methods below are based on the iRO Wiki reference. Every value and mechanic on this page remains marked To verify.": "The effects, causes, prevention methods and recovery methods below remain marked To verify until their current-game behavior is checked.",
            "Les effets, causes, moyens de prévention et moyens de récupération ci-dessous reprennent la référence iRO Wiki. Toutes les valeurs et mécaniques de cette page restent marquées À vérifier.": "Les effets, causes, moyens de prévention et moyens de récupération ci-dessous restent marqués À vérifier tant que leur fonctionnement actuel n’a pas été contrôlé.",
            "These are two different status effects on iRO. Only Frozen is listed above.": "These are two different status effects. Only Frozen is listed above.",
            "Ce sont deux effets de statut différents sur iRO. Seul Frozen est listé ci-dessus.": "Ce sont deux effets de statut différents. Seul Frozen est listé ci-dessus.",
            "iRO Wiki names the status Chaos and notes that it is also known as Confusion.": "Chaos is also known as Confusion.",
            "iRO Wiki nomme ce statut Chaos et précise qu’il est aussi appelé Confusion.": "Chaos est aussi appelé Confusion.",
            "iRO or another region may be used for layout/reference only, not to fill missing live values.": "Missing live values are not filled from unrelated datasets.",
            "iRO ou une autre région peut servir de référence de présentation, pas à remplir des valeurs live manquantes.": "Les valeurs live manquantes ne sont pas complétées à partir de données non vérifiées pour la version actuelle.",
            "High-value boss category used by Ragnarok’s MVP systems. The current release also has its own MVP Raid / Ruler systems, which should not be replaced with iRO MVP behavior.": "High-value boss category used by Ragnarok’s MVP systems. The current release also has its own MVP Raid / Ruler systems with their own rules.",
            "Catégorie de boss majeure utilisée par les systèmes MVP de Ragnarok. La version actuelle possède aussi ses propres systèmes MVP Raid / Ruler, qui ne doivent pas être remplacés par le comportement MVP d’iRO.": "Catégorie de boss majeure utilisée par les systèmes MVP de Ragnarok. La version actuelle possède aussi ses propres systèmes MVP Raid / Ruler avec leurs propres règles.",
            "Monster Base EXP, Job EXP and drop tables are among the values that differ frequently between Ragnarok versions. This wiki therefore uses current-server values instead of filling missing information with iRO data.": "Monster Base EXP, Job EXP and drop tables can vary between game versions. This wiki uses current-server values and leaves missing information undocumented until it is checked.",
            "La Base EXP, la Job EXP et les tables de drops sont parmi les valeurs qui diffèrent fréquemment entre les versions de Ragnarok. Ce wiki utilise donc les valeurs du serveur actuel au lieu de compléter les informations manquantes avec des données iRO.": "La Base EXP, la Job EXP et les tables de drops peuvent varier selon la version du jeu. Le wiki utilise les valeurs du serveur actuel et laisse les informations manquantes non documentées tant qu’elles ne sont pas contrôlées.",
            "These examples illustrate why Cast and Cooldown must be stored separately. Values are taken from current skill data rather than iRO.": "These examples illustrate why Cast and Cooldown must be stored separately. The values use the current skill data.",
            "Ces exemples montrent pourquoi Cast et Cooldown doivent être stockés séparément. Les valeurs proviennent des données actuelles et non d’iRO.": "Ces exemples montrent pourquoi Cast et Cooldown doivent être stockés séparément. Les valeurs utilisent les données de skills actuelles."
          }
          for a,b in repls.items():
              s = s.replace(a,b)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index('  function memorialDungeonData() {')
          b = s.index('\n  function sourcesLinksPage', a)
          ms = s[a:b]
          for banned in ['crosscheck:', 'Source cross-check', 'Croisement des sources', 'KRO/Criatura', '— Criatura Academy']:
              assert banned not in ms, banned
          assert "Neutral Lv.1 (KRO) / Lv.2 (TWRo)" not in ms
          assert "iRO note" not in s
          assert "Note iRO" not in s
          assert "based on the iRO Wiki reference" not in s
          assert "reprennent la référence iRO Wiki" not in s
          assert "rather than iRO" not in s
          assert "et non d’iRO" not in s
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Keep external site names inside Sources sections"
          git push origin HEAD:main
