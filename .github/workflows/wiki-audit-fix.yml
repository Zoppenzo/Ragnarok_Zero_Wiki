name: Apply Ragnarok Zero wiki audit fixes

on:
  push:
    paths:
      - '.github/workflows/wiki-audit-fix.yml'

permissions:
  contents: write

jobs:
  patch-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final level-cap consistency fixes
        run: python tools/wiki_audit_fix_2.py

      - name: Validate result
        run: |
          git diff --check
          grep -n "Current Global scope — 6 September 2026" index.html
          grep -n "2nd Class Job Level" index.html
          if grep -q "Current Global scope — 1 September 2026" index.html; then exit 1; fi

      - name: Commit fixes
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes to commit"
            exit 0
          fi
          git commit -m "Fix live level-cap table and final audit consistency"
          git push origin HEAD:main
