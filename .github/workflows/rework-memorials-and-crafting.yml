name: Rework Memorials and Crafting

on:
  push:
    paths:
      - '.github/workflows/rework-memorials-and-crafting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/rework_memorials_and_crafting.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert "function craftingDetailPage(id)" in s
          assert "#/crafting/potion-creation" in s
          assert "Neutral Lv.1 (KRO) / Lv.2 (TWRo)" in s
          assert "Croisement des sources" in s
          assert "orcs-memory-location.bmp" in s
          assert "prontera-culvert-location.bmp" in s
          assert "poring-village-location.bmp" in s
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add memorial guide images and split crafting pages"
          git push origin HEAD:main
