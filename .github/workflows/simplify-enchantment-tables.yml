name: Simplify Enchantment Tables

on:
  push:
    paths:
      - '.github/workflows/simplify-enchantment-tables.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply enchantment table rewrite
        run: python tools/simplify_enchantment_tables.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('  function enchantmentPage(topic) {')
          b=s.index('\n  function ',a+10)
          f=s[a:b]
          for x in [
            '<strong>100 000 zeny</strong>',
            "risk('danger','Yes','Oui')",
            'Item must be unequipped.',
            'enchant-simple-table',
            'Brandish Spear',
            'Exact rate not stated'
          ]: assert x in f,x
          for x in [
            'Trigger → Effect → Duration',
            'Déclencheur → Effet → Durée',
            'How to read the effects',
            'Comment lire les effets',
            'Le coût exact et le taux de réussite/destruction du reset en zeny ne sont pas affichés'
          ]: assert x not in f,x
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/wiki.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify enchantment guide into clear tables"
          git push origin HEAD:main
