name: Fix class 2 availability UI

on:
  push:
    paths:
      - '.github/workflows/fix-class2-availability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch class availability UI
        run: python tools/fix_class2_availability.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert "const upcoming=['knight'" not in s
          assert "Bientôt disponibles</h2>" not in s
          assert "Second classes are already shown as upcoming" not in s
          assert "Les secondes classes sont déjà affichées comme contenu à venir" not in s
          assert "const second=['knight','crusader','wizard','sage','hunter','bard','dancer','blacksmith','alchemist','assassin','rogue','priest','monk']" in s
          print('validation ok')
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix second classes still shown as coming soon"
          git push origin HEAD:main
