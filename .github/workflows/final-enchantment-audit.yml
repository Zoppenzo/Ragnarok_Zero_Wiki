name: Final Enchantment Audit

on:
  push:
    paths:
      - '.github/workflows/final-enchantment-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix temporary patch syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/final_enchantment_audit.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          lines=[x for x in lines if not x.strip().startswith('anchor=') and x.strip() != 'assert anchor in f']
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Apply final enchantment audit
        run: python tools/final_enchantment_audit.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('  function enchantmentPage(topic) {')
          b=s.index('\n  function ',a+10)
          f=s[a:b]
          for x in [
            'Brandish Spear damage by 40% for 60 seconds',
            'Amp cooldown -60 seconds',
            'Max HP +300 · +400',
            'Trigger → Effect → Duration',
            'Le coût exact et le taux de réussite/destruction du reset en zeny ne sont pas affichés'
          ]: assert x in f,x
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/wiki.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Finish enchantment completeness audit"
          git push origin HEAD:main