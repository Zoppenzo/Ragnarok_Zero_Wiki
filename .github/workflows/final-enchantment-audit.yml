name: Final Enchantment Audit

on:
  push:
    paths:
      - '.github/workflows/final-enchantment-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply simplified Essence presentation
        run: python tools/final_enchantment_audit.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('  function enchantmentPage(topic) {')
          b=s.index('\n  function ',a+10)
          f=s[a:b]
          for x in [
            'Pierce: Brandish Spear damage +40% for 60 seconds.',
            'Pierce : dégâts de Brandish Spear +40 % pendant 60 secondes.',
            'Swordsman Class — Two-Hand Quicken: Critical Damage +7% for 60 seconds.',
            'Thief Class — Sonic Blow: After Attack Delay -7% for 60 seconds.',
            'Improve Concentration: Blitz Beat damage +40% for 60 seconds (80% total).'
          ]: assert x in f,x
          for x in [
            'How to read the effects',
            'Comment lire les effets',
            'Trigger → Effect → Duration',
            'Déclencheur → Effet → Durée',
            'Afficher seulement +40 % sans le déclencheur et la durée serait incomplet'
          ]: assert x not in f,x
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/wiki.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify Essence effect display"
          git push origin HEAD:main
