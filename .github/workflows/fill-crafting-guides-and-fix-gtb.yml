name: Fill Crafting Guides And Fix GTB

on:
  push:
    paths:
      - '.github/workflows/fill-crafting-guides-and-fix-gtb.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/fill_crafting_guides_and_fix_gtb.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'destroy the remaining Ancient Thief Bug Eggs so Ancient Golden Thief Bug does not strengthen' in s
          assert 'function craftingDetailPageLegacy(id)' in s
          assert 'function craftingDetailPage(id)' in s
          assert "['Young Twig', [['Mute Arrow',1000]]]" in s
          assert 'Coldproof Potion' in s
          assert 'Condensed White Potion' in s
          assert 'Blacksmith Forging' in s
          for x in ['Damascus','Flamberge','Claymore','Two-Handed Axe','Stunner','Lance','Claw']:
              assert x in s, x
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fill crafting guides and correct GTB egg step"
          git push origin HEAD:main
