name: Fix Memorial Enchant Live Scope

on:
  push:
    paths:
      - '.github/workflows/fix-memorial-enchant-live-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/fix_memorial_enchant_live_scope.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('  function enchantmentPage(topic) {')
          b=s.index('\n  function ',a+10)
          f=s[a:b]
          for x in [
              '/navi prt_fild05 251/193',
              '/navi prt_in 135/35',
              '/navi prt_in 135/28',
              'Progression actuelle 60/60',
              'Expedition commence avec la progression Base 70',
              "Subjugation Team's Armor",
              "Expedition's Armor"
          ]:
              assert x in f, x
          assert 'Le montant en zeny du reset risqué est volontairement laissé vide' not in f
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/wiki.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Memorial enchant live scope and Knight requirements"
          git push origin HEAD:main
