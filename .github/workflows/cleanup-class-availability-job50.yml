name: Cleanup class availability and Job 50

on:
  push:
    paths:
      - '.github/workflows/cleanup-class-availability-job50.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cleanup class availability and Job 50 text
        run: python tools/cleanup_class_availability_and_job50.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'Job Lv.40' not in s
          assert 'Job Level 40' not in s
          assert 'Job Lv 40+' not in s
          assert '2e classe — bientôt disponible' not in s
          assert s.index('Novice Job EXP — Job Lv. 1 to 10') < s.index('Base Level EXP — Lv. 1 to 50') < s.index('First Class Job EXP — Job Lv. 1 to 50')
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Finish Job 50 and class availability cleanup"
          git push origin HEAD:main
