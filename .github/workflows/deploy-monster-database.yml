name: Deploy monster database

on:
  push:
    paths:
      - '.github/workflows/deploy-monster-database.yml'
      - '.github/scripts/apply_client_monsters.py'
      - '.github/scripts/build_monster_zero_overlay.py'
      - '.github/scripts/build_zero_monster_consensus.py'
      - '.github/scripts/augment_rozerodb_drops.py'
      - '.github/scripts/augment_zero_monster_spawns.py'
      - '.github/scripts/enforce_strict_monster_verification.py'
      - 'assets/client-monsters-data.js'
      - 'assets/client-monster-disable-legacy-maps.js'
      - 'assets/client-monster-identity.js'
      - 'assets/client-monster-navigation-current.js'
      - 'assets/client-monster-roster.js'
      - 'assets/monster-zero-stats.js'
      - 'assets/monster-zero-consensus.js'
      - 'assets/client-monsters.js'
      - 'assets/monster-client-corrections.js'
      - 'assets/monster-audit-20260909.js'
      - 'assets/client-monster-current-overlay.js'
      - 'assets/monster-verified-skill-associations.js'
      - 'assets/monster-strict-verification.js'
      - 'assets/client-monster-sprites.js'
      - 'assets/monster-detail-rms.js'
      - 'assets/monster-element-colors.js'
      - 'assets/monster-final-fixes.js'
      - 'assets/monster-instance-maps.js'
      - 'assets/monster-db-optimized.js'
      - 'assets/item-monster-drops.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build RagnaDex Zero evidence
        run: python .github/scripts/build_monster_zero_overlay.py

      - name: Build Zero database comparison set
        run: python .github/scripts/build_zero_monster_consensus.py

      - name: Cross-check drops with RO ZERO DATABASE
        run: python .github/scripts/augment_rozerodb_drops.py

      - name: Build candidate TWRoZ map data
        run: python .github/scripts/augment_zero_monster_spawns.py

      - name: Enforce strict multi-database verification
        run: python .github/scripts/enforce_strict_monster_verification.py

      - name: Wire strict monster and item data
        run: python .github/scripts/apply_client_monsters.py

      - name: Validate strict monster database
        run: |
          test -s assets/client-monsters-data.js
          test -s assets/client-monster-identity.js
          test -s assets/client-monster-navigation-current.js
          test -s assets/client-monster-roster.js
          test -s assets/monster-zero-consensus.js
          test -s assets/monster-strict-verification.js
          test -s assets/item-monster-drops.js
          grep -q 'assets/monster-strict-verification.js?v=20260911-strict-verified3' index.html
          grep -q 'assets/item-monster-drops.js?v=20260911-strict-verified3' index.html
          grep -q 'assets/monster-db-optimized.js?v=20260911-strict-verified3' index.html
          ! grep -q 'assets/monster-ragnaplace-exp.js' index.html
          grep -q 'WIKI_ELEMENT_TABLES' assets/monster-element-colors.js
          grep -q '\[100,150,150,150,150,0,75,75,75,75\]' assets/monster-element-colors.js
          node .github/scripts/debug_monster_nav.js
          python - <<'PY'
          import json
          from pathlib import Path

          text=Path('assets/monster-zero-consensus.js').read_text(encoding='utf-8')
          payload=text.split('window.RZ_MONSTER_ZERO_CONSENSUS=',1)[1].split(';\nwindow.RZ_MONSTER_ZERO_CONSENSUS_META=',1)[0]
          meta_payload=text.split('window.RZ_MONSTER_ZERO_CONSENSUS_META=',1)[1].rstrip().rstrip(';')
          data=json.loads(payload); meta=json.loads(meta_payload)
          assert 'STRICT:' in meta['policy'], meta
          assert meta['skillsPolicy'].startswith('No monster->skill association'), meta
          assert meta['mapsPolicy'].startswith('Only current-client Navi'), meta
          for mid,row in data.items():
              assert not row.get('skills'), (mid,row.get('skills'))
              assert not row.get('spawns'), (mid,row.get('spawns'))
              for field,fmeta in (row.get('fields') or {}).items():
                  assert fmeta.get('status')=='strict-consensus', (mid,field,fmeta)
                  assert len(set(fmeta.get('verifiedSources') or []))>=2, (mid,field,fmeta)
              for drop in row.get('drops') or []:
                  assert drop.get('relationVerified') is True, (mid,drop)
                  assert len(set(drop.get('verifiedSources') or []))>=2, (mid,drop)

          # Regression guards: these relations are independently present in at
          # least two Ragnarok Zero databases. Unknown rates must remain ???.
          argos=data.get('1100') or {}
          spider=next((d for d in argos.get('drops',[]) if d.get('itemId')==480573),None)
          assert spider and spider.get('relationVerified') is True, spider
          assert len(set(spider.get('verifiedSources') or []))>=2, spider
          assert spider.get('rate') is None, spider

          ak=data.get('1219') or {}
          abyss=next((d for d in ak.get('drops',[]) if d.get('itemId')==401072),None)
          lance=next((d for d in ak.get('drops',[]) if d.get('itemId')==630036),None)
          assert abyss and abyss.get('relationVerified') is True and abyss.get('rate') is None, abyss
          assert lance and lance.get('relationVerified') is True and lance.get('rate') is None, lance
          assert len(ak.get('drops') or [])>=8, ak.get('drops')
          print(json.dumps({
              'strictMeta':meta,
              'argosDrops':argos.get('drops'),
              'abysmalKnightDrops':ak.get('drops'),
          },indent=2))
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),path=require('path');
          const sandbox={console,setTimeout,clearTimeout};
          sandbox.window=sandbox; sandbox.globalThis=sandbox;
          sandbox.RO_DATA={monsters:[],items:[],maps:[]};
          const ctx=vm.createContext(sandbox);
          const files=[
            'assets/client-monsters-data.js',
            'assets/client-monster-disable-legacy-maps.js',
            'assets/client-monster-identity.js',
            'assets/client-monster-navigation-current.js',
            'assets/client-monster-roster.js',
            'assets/monster-zero-stats.js',
            'assets/monster-zero-consensus.js',
            'assets/rms-monster-behavior.js',
            'assets/client-monsters.js',
            'assets/monster-client-corrections.js',
            'assets/monster-audit-20260909.js',
            'assets/client-monster-current-overlay.js',
            'assets/monster-verified-skill-associations.js',
            'assets/monster-instance-maps.js',
            'assets/monster-strict-verification.js'
          ];
          for(const rel of files)vm.runInContext(fs.readFileSync(path.resolve(rel),'utf8'),ctx,{filename:rel});
          const monsters=sandbox.RO_DATA.monsters||[];
          if(!monsters.length)throw new Error('No runtime monsters');
          for(const m of monsters){
            if(!m.strictVerificationApplied)throw new Error(`Strict layer missing on #${m.id}`);
            const badMap=(m.maps||[]).find(x=>x?.clientVerified!==true&&String(x?.source||'')!=='client-navigation-current');
            if(badMap)throw new Error(`Unverified map survived on #${m.id}: ${JSON.stringify(badMap)}`);
            const badDrop=(m.drops||[]).find(x=>x?.relationVerified!==true);
            if(badDrop)throw new Error(`Unverified drop survived on #${m.id}: ${JSON.stringify(badDrop)}`);
          }
          const amer=monsters.find(m=>Number(m.clientId||m.id)===3812);
          if(amer&&amer.clientVerified===false&&amer.level!==null)throw new Error('Manual Amering level survived without exact client identity');
          const argos=monsters.find(m=>Number(m.clientId||m.id)===1100);
          const ak=monsters.find(m=>Number(m.clientId||m.id)===1219);
          if(!argos?.drops?.some(d=>Number(d.itemId)===480573))throw new Error('Argos costume relation missing at runtime');
          if((ak?.drops||[]).length<8)throw new Error(`Abysmal Knight drop list incomplete: ${(ak?.drops||[]).length}`);
          console.log({runtime:monsters.length,strict:true,argosDrops:argos.drops.length,abysmalKnightDrops:ak.drops.length});
          NODE

      - name: Commit deployment
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/monster-zero-stats.js assets/monster-zero-consensus.js
          git diff --cached --quiet && exit 0
          git commit -m "Deploy strict verified monster data"
          git push
