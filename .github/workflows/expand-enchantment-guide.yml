name: Expand Enchantment Guide

on:
  push:
    paths:
      - '.github/workflows/expand-enchantment-guide.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply detailed enchantment guide patch
        run: python tools/expand_enchantment_guide.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index('  function enchantmentPage(topic) {')
          b = s.index('\n  function ', a + 10)
          f = s[a:b]
          guide_body = f.split('${officialSources([', 1)[0]
          for site_name in ['MidgardHub','Criatura','iRO Wiki','roz-global','TWRo','KRO']:
              assert site_name not in guide_body, site_name
          for x in [
              'System summary',
              '70 % de réussite',
              '30 % de destruction de l’objet',
              'Random option rates — refine +0 to +8',
              'Essence II Lv.2',
              '1 Pet Egg + 10 000 zeny',
              '/navi prontera 218/211'
          ]:
              assert x in f, x
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          assert scripts, 'script block missing'
          main = max(scripts, key=len)
          Path('/tmp/wiki.js').write_text(main, encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Expand enchantment page into complete guide"
          git push origin HEAD:main
