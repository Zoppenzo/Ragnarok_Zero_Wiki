name: Split Memorial Enchant Pages

on:
  push:
    paths:
      - '.github/workflows/split-memorial-enchant-pages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/split_memorial_enchant_pages.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for x in [
            '#/wiki/enchantment-memorial-subjugation-grade-iv',
            '#/wiki/enchantment-memorial-expedition-grade-iii',
            '#/wiki/enchantment-memorial-dispatching-grade-ii',
            '#/wiki/enchantment-memorial-conqueror-grade-i',
            "_memorialGrade:'conqueror-grade-i'",
            'Reset zeny : 30 % de risque de détruire l’équipement'
          ]: assert x in s,x
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/wiki.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Split Memorial enchantment grades into separate pages"
          git push origin HEAD:main
