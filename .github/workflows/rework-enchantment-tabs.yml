name: Rework Enchantment Tabs

on:
  push:
    paths:
      - '.github/workflows/rework-enchantment-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply enchantment tabs patch
        run: python tools/rework_enchantment_tabs.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index('  function enchantmentPage(topic) {')
          b = s.index('\n  function ', a + 10)
          f = s[a:b]
          guide_body = f.split('${officialSources([', 1)[0]
          for site_name in ['MidgardHub','Criatura','TWRo','KRO','roz-global']:
              assert site_name not in guide_body, site_name
          for x in ['enchant-panel-costume','enchant-panel-poring','enchant-panel-memorial','enchant-panel-essences','enchant-panel-taming']:
              assert x in f, x
          script = re.search(r'<script>(.*)</script>', s, re.S)
          assert script, 'script block missing'
          Path('/tmp/wiki.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rework enchantment page into system tabs"
          git push origin HEAD:main
