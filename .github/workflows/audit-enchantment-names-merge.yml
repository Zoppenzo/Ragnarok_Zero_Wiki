name: Audit Enchantment Names Merge

on:
  push:
    paths:
      - '.github/workflows/audit-enchantment-names-merge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply enchantment audit patch
        run: python tools/audit_enchantment_names_merge.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index('  function enchantmentPage(topic) {')
          b = s.index('\n  function ', a + 10)
          f = s[a:b]
          for x in [
              'Costume Enchant', 'Poring Village Enchant', 'Memorial Dungeon Enchant',
              "Swordsman's Essence Lv.1", 'Assassin Essence II Lv.2',
              "Rogue's Essence Lv.1", 'Intimidate level',
              '/navi prontera 218/21'
          ]:
              assert x in f, x
          for x in ['id="enchant-tab-essences"','for="enchant-tab-essences"','Essences de classe','1 Pet Egg + 10 000 zeny','Ring destruction','Variable Casting Stone (Garment)']:
              assert x not in f, x
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          assert scripts
          Path('/tmp/wiki.js').write_text(max(scripts,key=len), encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Merge Job Essence into Memorial enchant guide and audit names"
          git push origin HEAD:main
