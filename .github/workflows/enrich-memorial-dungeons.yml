name: Enrich Memorial Dungeons

on:
  push:
    paths:
      - '.github/workflows/enrich-memorial-dungeons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply enrichment
        run: python tools/enrich_memorial_dungeons.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index('  function memorialDbSlug')
          b = s.index('\n  function statusEffectsPage', a)
          mem = s[a:b]
          for banned in ['Croisement des sources','Source cross-check','KRO/Criatura','Référence KRO']:
              assert banned not in mem, banned
          for wanted in ['Walkthrough','Headgear enchant',"memorialDbLink('monsters'", "memorialDbLink('items'", "hash[0]==='items'&&hash[1]", "hash[0]==='monsters'&&hash[1]"]:
              assert wanted in s, wanted
          assert '2,110,562' in mem
          assert '1,200,000' in mem
          assert 'Jello Fragment Box' in mem
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Expand Memorial Dungeon guides and database links"
          git push origin HEAD:main
