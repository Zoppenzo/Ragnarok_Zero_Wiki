name: Apply Client-Verified Enchantments

on:
  push:
    paths:
      - '.github/workflows/apply-client-verified-enchantments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply client-verified corrections
        run: python tools/apply_client_verified_enchantments.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('  function enchantmentPage(topic) {')
          b=s.index('\n  function monsterSkillsPage(topic) {',a)
          sec=s[a:b]
          for x in [
              "Brandish Spear : dégâts +40 %.",
              "Swordsman Class : Critical Damage +7 %.",
              "Blitz Beat : dégâts +80 %.",
              "Expedition's Armor",
              "Expedition's Robe",
              "Subjugation Team Boots",
              'const mdDispatchingItems = [];',
              'const mdConquerorItems = [];'
          ]:
              assert x in sec, x
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          main=max(scripts,key=len)
          Path('/tmp/wiki.js').write_text(main,encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Correct enchantments from current Global client"
          git push origin HEAD:main
