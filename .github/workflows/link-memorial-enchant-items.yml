name: Link Memorial Enchant Items

on:
  push:
    paths:
      - '.github/workflows/link-memorial-enchant-items.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/link_memorial_enchant_items.py
      - name: Validate
        run: |
          git diff --check
          grep -q "memorialDbLink('items','Jellopy')" index.html
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Link Memorial enchant materials to item database"
          git push origin HEAD:main
