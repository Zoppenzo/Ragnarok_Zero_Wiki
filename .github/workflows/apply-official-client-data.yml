name: Apply official client data

on:
  push:
    paths:
      - '.github/workflows/apply-official-client-data.yml'
      - '.github/scripts/apply_official_client_data.py'
      - '.github/scripts/fix_skill_glossary_layout.py'
      - '.github/scripts/audit_cleanup.py'
      - '.github/scripts/build_client_items.py'
      - '.github/scripts/build_item_icons.py'
      - '.github/scripts/apply_client_items.py'
      - '.github/scripts/apply_item_icons.py'
      - 'assets/client-data/skills.part*'
      - 'assets/client-data/items-core.part*'
      - 'assets/client-data/item-icons-map.part*'
      - 'assets/client-items.js'
      - 'assets/client-item-stats.js'
      - 'assets/item-db-optimized.js'
      - 'assets/client-item-icons.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply official client skill data
        run: python .github/scripts/apply_official_client_data.py

      - name: Apply skill glossary and layout rules
        run: python .github/scripts/fix_skill_glossary_layout.py

      - name: Apply audit cleanup
        run: python .github/scripts/audit_cleanup.py

      - name: Build official client item data
        run: python .github/scripts/build_client_items.py

      - name: Build official item icon mapping
        run: python .github/scripts/build_item_icons.py

      - name: Apply official client item UI
        run: python .github/scripts/apply_client_items.py

      - name: Apply item micro icons
        run: python .github/scripts/apply_item_icons.py

      - name: Validate generated files
        run: |
          python -m json.tool assets/client-data/skills.json >/dev/null
          test -s assets/client-data/skills.json
          test ! -e assets/client-data/skills.zlib.b64
          test ! -e assets/database/memorial-dungeon.gif
          grep -q 'assets/client-sync.js' index.html
          grep -q "boss:'Orc Hero'" index.html
          ! grep -q "Client effect" assets/client-sync.js
          grep -q "function skillLevelEffectRows" index.html
          grep -q "<th>\${navLabel('Bonus','Bonus')}</th>" index.html
          grep -q "Audit du contenu : 8 sept. 2026." index.html
          grep -q "if (data.type === 'none') return '';" index.html
          grep -q "const hasFormulaSection = skillDamageFormulaData(sk).type !== 'none';" index.html
          ! grep -q "const pageObserver = new MutationObserver" index.html

          python -m json.tool assets/client-data/items.json >/dev/null
          python - <<'PY'
          import json
          items=json.load(open('assets/client-data/items.json',encoding='utf-8'))
          icons=json.load(open('assets/client-data/item-icons.json',encoding='utf-8'))
          assert len(items)==4033, len(items)
          assert len(icons)==3954, len(icons)
          by_id={int(x['i']):x for x in items}
          assert by_id[517]['n']=='Meat'
          assert by_id[519]['n']=='Milk'
          assert by_id[1201]['n']=='Knife' and by_id[1201]['a']==17
          assert by_id[4001]['n']=='Poring Card'
          PY
          test -s assets/client-items-data.js
          test -s assets/client-data/item-icons.json
          test -s assets/client-item-stats.js
          test -s assets/item-db-optimized.js
          grep -q 'assets/client-items-data.js' index.html
          grep -q 'assets/client-item-stats.js' index.html
          grep -q 'assets/client-items.js' index.html
          grep -q 'assets/item-db-optimized.js' index.html
          grep -q 'assets/client-item-icons.js' index.html
          grep -q 'window.RZ_CLIENT_ITEMS' assets/client-items-data.js
          grep -q 'window.RZ_ITEM_STAT_OVERLAY' assets/client-item-stats.js
          grep -q 'const DEFAULT_PAGE_SIZE = 25' assets/item-db-optimized.js
          grep -q "RZ_ITEM_DB_OPT?.wire(type)" index.html
          grep -q "mdef: extra.mdef" assets/client-items.js
          grep -q "sellPrice: r.sp" assets/client-items.js
          grep -q "item.mdef!=null?infoRow('MDEF'" index.html
          grep -q 'static.divine-pride.net/images/items/item/' assets/client-item-icons.js
          ! grep -q 'MutationObserver' assets/client-item-icons.js

      - name: Commit deployment
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Deploy optimized Zero item database"
          git push
