name: Fix Blacksmith Forging From Client

on:
  push:
    paths:
      - '.github/workflows/fix-blacksmith-forging-client.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply client-verified forging values
        run: python tools/fix_blacksmith_forging_from_client.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.index("    if (id === 'blacksmith-forging') {")
          g = s.index("      const groups = [", a)
          b = s.index("      const matHtml", g)
          x = s[g:b]
          expected = [
            "[2,'Slayer',['25 Steel',\"20 Dead Man's Nail\"]]",
            "[3,'Two-Handed Axe',['8 Oridecon','10 Steel','1 Amethyst']]",
            "[3,'Stunner',['120 Steel',\"1 Orc Warrior's Token\"]]",
            "[3,'Lance',['12 Oridecon','3 Ruby','2 Devil Horn']]",
            "[1,'Baghnakh',['160 Iron','1 Pearl']]",
            "[2,'Hora',['65 Steel']]",
          ]
          for e in expected: assert e in x, e
          for bad in ['24 Steel','Heroic Emblem','Horrendous Mouth','Decayed Nail','Cracked Diamond','Evil Horn','Waghnak','Knuckle Dusters','Studded Knuckles','Scimiter',"[3,'Flamberge'"]:
              assert bad not in x, bad
          PY
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Correct Blacksmith forging tables from Global client"
          git push origin HEAD:main
