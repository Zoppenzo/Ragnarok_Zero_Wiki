name: Split Memorial Enchants By Item

on:
  push:
    paths:
      - '.github/workflows/split-memorial-enchants-by-item.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split Memorial enchant tables by item
        run: python tools/split_memorial_enchants_by_item.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('  function enchantmentPage(topic) {')
          b=s.index('\n  function ',a+10)
          f=s[a:b]
          for x in [
            'mdSubjugationItems.map(mdItemTable)',
            'mdExpeditionItems.map(mdItemTable)',
            'mdDispatchingItems.map(mdItemTable)',
            'mdConquerorItems.map(mdItemTable)',
            "Subjugation Team's Armor",
            'Expedition Armor',
            'Dispatching Chain Mail',
            'Conqueror Chain Mail',
            'Yes — 30% destruction',
            'Oui — 30 % de destruction',
            '100 000 zeny'
          ]: assert x in f,x
          # Previous mixed blocks must be gone from the rendered Memorial panel.
          m=f.index('<section class="enchant-tab-panel" id="enchant-panel-memorial">')
          n=f.index('<section class="enchant-tab-panel" id="enchant-panel-taming">',m)
          panel=f[m:n]
          for x in ['Equipment, slot and Job Essence access','Équipement, slot et accès Job Essence','<h3>1st Job Essence</h3>','<h3>2nd Job Essence</h3>','Normal random options']:
              assert x not in panel,x
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/wiki.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/wiki.js
      - name: Commit
        run: |
          git config user.name "Ragnarok Zero Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Split Memorial enchant tables by equipment item"
          git push origin HEAD:main
