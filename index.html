  function mvpRaidPage(topic) {
    const title = lang==='fr' ? (topic.fr||topic.en) : topic.en;
    const raidRows = [
      {
        boss:'Golden Thief Bug',
        access:navLabel('Prontera Culvert — last floor','Prontera Culvert — dernier étage'),
        pve:navLabel('General Habitat / PvE — red warp','General Habitat / PvE — warp rouge'),
        pvp:navLabel('PK Habitat / PvP — gold warp','PK Habitat / PvP — warp doré'),
        release:navLabel('August 18, 2026 — server launch','18 août 2026 — ouverture du serveur')
      },
      {
        boss:'Moonlight Flower',
        access:'Payon Cave 5',
        pve:navLabel('General Habitat / PvE','General Habitat / PvE'),
        pvp:navLabel('PK Habitat / PvP','PK Habitat / PvP'),
        release:navLabel('August 18, 2026 — server launch','18 août 2026 — ouverture du serveur')
      }
    ];

    const rewardRows = [
      {
        boss:'Golden Thief Bug',
        standard:[
          'Battle Golden Thief Bug Doll',
          '[Costume] Golden Headgear (Bound)',
          'Blacksmith\'s Blessing ×1',
          'Blacksmith\'s Blessing Powder ×2 / ×3',
          'Blessing of Yggdrasil ×1 / ×2 / ×3',
          '[Golden ThiefBug] Energy Fragment ×1 / ×2 / ×3'
        ],
        deluxe:[
          'Battle Golden Thief Bug Doll',
          '[Costume] Golden Headgear (Bound)',
          'Blacksmith\'s Blessing ×2',
          'Blacksmith\'s Blessing Powder ×3 / ×4',
          'Blessing of Yggdrasil ×2 / ×3',
          '[Golden ThiefBug] Energy Fragment ×2 / ×3'
        ]
      },
      {
        boss:'Moonlight Flower',
        standard:[
          'Battle Moonlight Flower Doll',
          '[Costume] Moonlight Flower Bell (Bound)',
          'Blacksmith\'s Blessing ×1',
          'Blacksmith\'s Blessing Powder ×2 / ×3',
          'Blessing of Yggdrasil ×1 / ×2 / ×3',
          '[Moonlight Flower] Energy Fragment ×1 / ×2 / ×3'
        ],
        deluxe:[
          'Battle Moonlight Flower Doll',
          '[Costume] Moonlight Flower Bell (Bound)',
          'Blacksmith\'s Blessing ×2',
          'Blacksmith\'s Blessing Powder ×3 / ×4',
          'Blessing of Yggdrasil ×2 / ×3',
          '[Moonlight Flower] Energy Fragment ×2 / ×3'
        ]
      }
    ];

    return `${breadcrumbs([{label:title}])}
      <div class="article-heading"><h1>${icon('monster')}${esc(title)}</h1><div class="page-subtitle">${t('fromWiki')}</div></div>

      <p class="article-lead">${navLabel(
        'An MVP Raid is a dedicated version of an MVP area. Each raid is tied to one specific boss and gives players a place to hunt that MVP without relying on its normal field spawn. Current raids have a General Habitat for PvE and a PK Habitat for PvP, plus their own hunting quest and reward boxes.',
        'Un MVP Raid est une version dédiée de la zone d’un MVP. Chaque raid est lié à un boss précis et permet de le chasser sans dépendre de son spawn classique sur une map. Les raids actuels possèdent une General Habitat en PvE et une PK Habitat en PvP, ainsi qu’une quête de chasse et des boîtes de récompense propres au MVP.'
      )}</p>

      ${toc([
        {id:'overview',label:navLabel('How MVP Raids work','Fonctionnement des MVP Raids')},
        {id:'available-raids',label:navLabel('Available MVP Raids','MVP Raids disponibles')},
        {id:'raid-rules',label:navLabel('General and PK Habitats','General et PK Habitats')},
        {id:'hunting-quest',label:navLabel('Hunting Quest — Yakt','Quête de chasse — Yakt')},
        {id:'gtb-raid',label:'Golden Thief Bug'},
        {id:'moonlight-raid',label:'Moonlight Flower'},
        {id:'rewards',label:navLabel('Reward boxes','Boîtes de récompense')},
        {id:'fragments',label:'Energy Fragments'},
        {id:'raid-manager',label:'Raid Manager Yakt'}
      ])}

      <h2 id="overview">${navLabel('How MVP Raids work','Fonctionnement des MVP Raids')}</h2>
      <p>${navLabel(
        'The raid is separate from the normal dungeon population. You enter the habitat dedicated to the MVP, wait for or find the boss there, kill it, then use the raid rewards and fragments obtained from the fight. The system is therefore both an MVP-hunting activity and a repeatable source of progression materials.',
        'Le raid est séparé des monstres normaux du donjon. Tu entres dans l’habitat dédié au MVP, tu trouves le boss lorsqu’il est présent, tu le tues puis tu récupères les récompenses et fragments liés au raid. Le système sert donc à la fois à chasser les MVP et à récupérer régulièrement des matériaux de progression.'
      )}</p>
      <p>${navLabel(
        'The two MVP Raids currently available are Golden Thief Bug in Prontera Culvert and Moonlight Flower in Payon Cave 5.',
        'Les deux MVP Raids actuellement disponibles sont Golden Thief Bug à Prontera Culvert et Moonlight Flower à Payon Cave 5.'
      )}</p>

      <h2 id="available-raids">${navLabel('Available MVP Raids','MVP Raids disponibles')}</h2>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>MVP</th>
          <th>${navLabel('Access area','Zone d’accès')}</th>
          <th>${navLabel('PvE zone','Zone PvE')}</th>
          <th>${navLabel('PvP zone','Zone PvP')}</th>
          <th>${navLabel('Available since','Disponible depuis')}</th>
        </tr></thead>
        <tbody>${raidRows.map(r=>`<tr>
          <th>${esc(r.boss)}</th>
          <td>${r.access}</td>
          <td>${r.pve}</td>
          <td>${r.pvp}</td>
          <td>${r.release}</td>
        </tr>`).join('')}</tbody>
      </table></div>

      <h2 id="raid-rules">${navLabel('General and PK Habitats','General et PK Habitats')}</h2>
      <p>${navLabel(
        'Each current raid has two habitats. The General Habitat is the PvE version: players focus on the MVP and cannot attack one another. The PK Habitat enables PvP, so players and groups can fight each other while contesting the same MVP.',
        'Chaque raid actuel possède deux habitats. La General Habitat correspond à la version PvE : les joueurs se concentrent sur le MVP et ne peuvent pas s’attaquer entre eux. La PK Habitat active le PvP : les joueurs et groupes peuvent donc s’affronter tout en se disputant le même MVP.'

  function getPoringPage(topic) {

      <h2 id="overview">${navLabel('What is Get Poring?','Qu’est-ce que Get Poring ?')}</h2>

        'Get Poring fonctionne directement dans le navigateur et ne demande aucun téléchargement supplémentaire. Il utilise l’écosystème de compte GNJOY de Ragnarok Zero et repose sur l’élevage de Porings à collectionner, qui peuvent ensuite devenir des compagnons dans le jeu principal.'

      <div class="wiki-feature-list">
        <div><strong>${miniIcon('item')}${navLabel('Care','Soins')}</strong><p>${navLabel(

      <h2 id="access">${navLabel('Access and account','Accès et compte')}</h2>

        'Get Poring se lance depuis son site officiel. Lier le jeu à ton compte GNJOY permet de conserver les données associées à ton compte et fait aussi partie des moyens actuels d’obtenir un ROZG 1 Day Ticket.'

      <div class="hero-actions">

      <h2 id="care">${navLabel('Taking care of a Poring','S’occuper de son Poring')}</h2>

      <h2 id="marriage">${navLabel('Marriage and Family Tree','Mariage et arbre généalogique')}</h2>
      <p>${navLabel(

      )}</p>

      <h2 id="tickets">ROZG 1 Day Tickets</h2>
      <p>${navLabel(
        'Get Poring currently offers up to three ROZG 1 Day Tickets through specific activities. The tickets are delivered to the Ragnarok Zero in-game mailbox.',
        'Get Poring permet actuellement d’obtenir jusqu’à trois ROZG 1 Day Tickets grâce à certaines activités. Les tickets sont envoyés dans la boîte aux lettres en jeu de Ragnarok Zero.'

      <div class="table-wrap"><table>

        </tbody>
      </table></div>

      <h2 id="compendium">Poring Compendium</h2>
      <p>${navLabel(

      )}</p>
    `;
  }


  function roFactoryPage(topic) {
    const title = lang==='fr' ? (topic.fr||topic.en) : topic.en;

    return `${breadcrumbs([{label:title}])}
      <div class="article-heading"><h1>${icon('tools')}${esc(title)}</h1><div class="page-subtitle">${t('fromWiki')}</div></div>

      <p class="article-lead">${navLabel(
        'RO Factory is the official User-Generated Content platform for creating custom Footprint effects. A Footprint uses an image chosen by the creator and appears around the character and on the ground while the character moves. Finished creations can be registered on the Market and used directly in Ragnarok Zero.',
        'RO Factory est la plateforme officielle de contenu créé par les joueurs pour fabriquer des effets Footprint personnalisés. Un Footprint utilise une image choisie par le créateur et apparaît autour du personnage ainsi que sur le sol lorsqu’il se déplace. Une création terminée peut être enregistrée sur le Market puis utilisée directement dans Ragnarok Zero.'
      )}</p>

      ${toc([
        {id:'overview',label:navLabel('What is RO Factory?','Qu’est-ce que RO Factory ?')},
        {id:'create',label:navLabel('Create a Footprint','Créer un Footprint')},
        {id:'editor',label:navLabel('Editor settings','Réglages de l’éditeur')},
        {id:'register',label:navLabel('Save and register','Sauvegarder et enregistrer')},
        {id:'market',label:navLabel('RO Market','RO Market')},
        {id:'in-game',label:navLabel('Using a Footprint in-game','Utiliser un Footprint en jeu')},
        {id:'faq',label:'FAQ'}

      <h2 id="overview">${navLabel('What is RO Factory?','Qu’est-ce que RO Factory ?')}</h2>
      <p>${navLabel(
        'RO Factory is a creation tool connected to Ragnarok Zero. Its current creation type is the Footprint: a visual effect that leaves your chosen image behind as the character moves. The same creation can be saved, registered and shown to other players through the Market.',
        'RO Factory est un outil de création connecté à Ragnarok Zero. Le type de création actuel est le Footprint : un effet visuel qui laisse l’image choisie derrière le personnage pendant ses déplacements. Une même création peut être sauvegardée, enregistrée puis présentée aux autres joueurs sur le Market.'
      )}</p>

      <div class="wiki-feature-list">
        <div><strong>${miniIcon('item')}${navLabel('Import','Importer')}</strong><p>${navLabel(
          'Choose the image that will be used for the Footprint.',
          'Choisis l’image qui servira de Footprint.'
        )}</p></div>
        <div><strong>${miniIcon('tools')}${navLabel('Edit','Modifier')}</strong><p>${navLabel(
          'Adjust how the Footprint looks and moves.',
          'Règle l’apparence et le comportement du Footprint.'
        )}</p></div>
        <div><strong>${miniIcon('map')}${navLabel('Preview','Prévisualiser')}</strong><p>${navLabel(
          'Check the result directly on a game preview.',
          'Vérifie directement le résultat dans une prévisualisation du jeu.'
        )}</p></div>
        <div><strong>${miniIcon('item')}${navLabel('Market','Market')}</strong><p>${navLabel(
          'Register the creation so other players can find and use it.',
          'Enregistre la création afin que les autres joueurs puissent la trouver et l’utiliser.'
        )}</p></div>
      </div>

      <h2 id="create">${navLabel('Create a Footprint','Créer un Footprint')}</h2>
      <p>${navLabel(
        'Creation starts by choosing an image. RO Factory shows both the image around the character and the mark that will remain on the ground, which makes it possible to judge the result before registering anything.',
        'La création commence par le choix d’une image. RO Factory montre à la fois l’image autour du personnage et la marque qui restera sur le sol, ce qui permet de juger le résultat avant d’enregistrer quoi que ce soit.'
      )}</p>

      <p>${navLabel(

        'L’éditeur de Footprint permet de modifier la taille et la position de l’image, son intervalle d’apparition ainsi que la manière dont l’effet suit le déplacement du personnage. Une même image peut donc donner un résultat très différent selon les réglages.'
      )}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>${navLabel('Setting','Réglage')}</th><th>${navLabel('Purpose','Utilité')}</th></tr></thead>
        <tbody>
          <tr><th>${navLabel('Size','Taille')}</th><td>${navLabel('Changes the displayed size of the Footprint image.','Modifie la taille d’affichage de l’image du Footprint.')}</td></tr>

          <tr><th>${navLabel('Appearance interval','Intervalle d’apparition')}</th><td>${navLabel('Controls how often a new Footprint appears while moving.','Contrôle la fréquence à laquelle un nouveau Footprint apparaît pendant le déplacement.')}</td></tr>
          <tr><th>${navLabel('Movement feel','Mouvement')}</th><td>${navLabel('Changes the way the visual effect behaves during movement.','Modifie la façon dont l’effet visuel se comporte pendant les déplacements.')}</td></tr>

      </table></div>

      <h2 id="register">${navLabel('Save and register','Sauvegarder et enregistrer')}</h2>

        'Un Footprint peut être sauvegardé avant sa publication puis rechargé plus tard pour être modifié. Lorsqu’il est terminé, il passe par le processus d’enregistrement. Un Footprint enregistré peut recevoir un nom et des tags avant d’être affiché sur le Market.'
      )}</p>
      <div class="wiki-callout warning-lite"><strong>${navLabel('Saving is not publishing','Sauvegarder ne publie pas')}</strong><br>${navLabel(

        'Un Footprint simplement sauvegardé n’est pas immédiatement utilisable par les autres joueurs. Il doit d’abord être enregistré puis rendu public sur le Market.'
      )}</div>

      <h2 id="market">RO Market</h2>
      <p>${navLabel(
        'The Market is where registered Footprints are presented to other players. Creators can publish their work there, while players can browse the available creations and obtain the Footprints they want.',
        'Le Market est l’endroit où les Footprints enregistrés sont présentés aux autres joueurs. Les créateurs peuvent y publier leurs créations, tandis que les joueurs peuvent parcourir les Footprints disponibles et récupérer ceux qui les intéressent.'
      )}</p>
      <div class="hero-actions">
        <a class="button primary" href="https://roz.mygnjoy.com/en/rofactory/about" target="_blank" rel="noopener">${miniIcon('tools')}${navLabel('Official RO Factory guide','Guide officiel RO Factory')}</a>
        <a class="button" href="https://roz.mygnjoy.com/en/rofactory/market" target="_blank" rel="noopener">${miniIcon('item')}${navLabel('Browse the Market','Voir le Market')}</a>

        'A Footprint obtained from the Market is delivered as an in-game item and appears in the Consumables section of the Inventory. Double-click the item to activate the Footprint. While it is active, the effect appears each time the character moves.',
        'Un Footprint obtenu sur le Market est livré sous forme d’objet en jeu et apparaît dans la catégorie Consumables de l’inventaire. Double-clique sur l’objet pour activer le Footprint. Tant qu’il est actif, l’effet apparaît à chaque déplacement du personnage.'
      )}</p>
      <p>${navLabel(
        'The item is not consumed when activated. Double-clicking it again turns the Footprint effect off.',

      )}</p>

      <h2 id="faq">FAQ</h2>
      <div class="faq-list">

          <h3>${navLabel('Can a newly created Footprint be used immediately?','Peut-on utiliser immédiatement un Footprint que l’on vient de créer ?')}</h3>
          <p>${navLabel(
            'No. Saving keeps the creation in the editor, but it still has to be registered and published through the Market process.',
            'Non. La sauvegarde conserve la création dans l’éditeur, mais elle doit encore être enregistrée et publiée via le Market.'
          )}</p>

  function itemCategoryInfo(item) {
    const type = String(item.type || '').toLowerCase();
    const subtype = String(item.subtype || '').toLowerCase();
    if (type === 'card') return 'cards';
    if (item.equipmentSlot || /weapon|armor|shield|garment|foot|shoe|head|accessor|equipment/.test(type + ' ' + subtype)) return 'equipment';
    if (/consum|healing|potion|food|scroll|usable|ammo|ammunition/.test(type + ' ' + subtype)) return 'consumables';
    if (/quest/.test(type + ' ' + subtype)) return 'quest';
    if (/material|etc|ore|ingredient|craft/.test(type + ' ' + subtype)) return 'materials';
    return 'misc';
  }

  function mapsForWorldPoint(point) {
    return DATA.maps.filter(map => {
      const id = String(map.id || '').toLowerCase();
      const internal = String(map.internalName || '').toLowerCase();
      const name = String(map.name || '').toLowerCase();
      const exactIds = (point.mapIds || []).map(x=>x.toLowerCase());
      if (exactIds.includes(id) || exactIds.includes(internal)) return true;
      const haystack = `${id} ${internal} ${name}`;
      return (point.patterns || []).some(pattern => haystack.includes(pattern.toLowerCase()));
    });
  }

  function monstersForMapIds(ids) {
    return DATA.monsters.filter(monster => (monster.maps || []).some(link => ids.includes(link.mapId)));
  }

  function worldMapPage() {
    const points = worldMapPointData();
    const remote = worldMapRemoteLocations();

    // Multiple locations can share one atlas cell (for example Geffen + Geffen Dungeon).
    // The group is centered on the cell; dots are spread symmetrically around that center.
    const groups = new Map();
    points.forEach(point => {
      const key = `${point.x.toFixed(1)}:${point.y.toFixed(1)}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(point);
    });

    const hotspotHtml = [...groups.values()].flatMap(group => group.map((point,index) => {
      const maps = mapsForWorldPoint(point);
      const monsters = monstersForMapIds(maps.map(m=>m.id));
      const monsterNames = [...new Set(monsters.map(m=>m.name))];
      const loadedMapNames = maps.map(m=>m.name);
      const referenceMaps = point.mapIds || [];
      const monstersText = monsterNames.length
        ? monsterNames.slice(0,10).map(name=>esc(name)).join(', ') + (monsterNames.length > 10 ? '…' : '')
        : navLabel('No monster relation imported here yet.','Aucune relation de monstre importée ici pour le moment.');
      const mapsText = loadedMapNames.length
        ? loadedMapNames.slice(0,6).map(name=>esc(name)).join(', ')
        : referenceMaps.slice(0,6).map(id=>`<code>${esc(id)}</code>`).join(', ');
      const moreMaps = referenceMaps.length > 6 ? ` +${referenceMaps.length - 6}` : '';
      const kind = point.type === 'dungeon' ? navLabel('Dungeon','Donjon') : navLabel('City','Ville');
      const spread = group.length > 1 ? (index - (group.length - 1) / 2) * 13 : 0;

      return `<button class="world-hotspot ${point.type}" type="button"
        style="left:calc(${point.x}% + ${spread}px);top:${point.y}%"
        aria-label="${esc(point.name)} — ${esc(kind)}">
        <span class="world-tooltip"><strong>${esc(point.name)}</strong>
          <span><b>${navLabel('Type','Type')}:</b> ${kind}</span>
          <span><b>${navLabel('Maps','Maps')}:</b> ${mapsText || '—'}${moreMaps}</span>
          <span><b>${navLabel('Monsters','Monstres')}:</b> ${monstersText}</span>
        </span>
      </button>`;
    })).join('');

    return `${breadcrumbs([{label:navLabel('World Map','Carte du monde')}])}
      <div class="article-heading"><h1>${icon('map')}${navLabel('World Map','Carte du monde')}</h1><div class="page-subtitle">${t('fromWiki')}</div></div>
      <p class="article-lead">${navLabel(
        'The map uses the in-game Orbis of Midgard atlas. Town and dungeon geography is referenced against RateMyServer’s Map Database and World Map, while monster information continues to come from this wiki’s own dataset.',
        'La carte utilise l’atlas en jeu Orbis of Midgard. La géographie des villes et donjons est recoupée avec la Map Database et la World Map de RateMyServer, tandis que les informations de monstres continuent de venir de notre propre base.'
      )}</p>

  function listView(type) {
    const cfg = listConfig[type];
    if (!cfg) return notFound();
    setTimeout(() => wireList(type), 0);
    return `${breadcrumbs([{label:t(cfg.title)}])}
      <div class="article-heading"><h1>${icon(cfg.icon)}${t(cfg.title)}</h1><div class="page-subtitle">${t('fromWiki')}</div></div>
      <p>${t(cfg.intro)}</p>
      ${demoAlert()}
      <div class="filters">
        <div class="form-field"><label>${t('searchInList')}</label><input id="list-search" class="input" type="search" placeholder="${t('searchInList')}…"></div>
        ${type === 'items' ? `<div class="form-field"><label>${t('type')}</label><select id="list-filter" class="select"><option value="">${t('all')}</option>${[...new Set(DATA.items.map(x=>x.type))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>` : ''}
        ${type === 'monsters' ? `<div class="form-field"><label>${t('race')}</label><select id="list-filter" class="select"><option value="">${t('all')}</option>${[...new Set(DATA.monsters.map(x=>x.race))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>` : ''}
        ${type === 'quests' ? `<div class="form-field"><label>${t('type')}</label><select id="list-filter" class="select"><option value="">${t('all')}</option>${[...new Set(DATA.quests.map(x=>x.type))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>` : ''}
      </div>
      <div id="result-count" class="result-count"></div>
      <div id="list-output"></div>`;
  }

  function wireList(type) {
    const search = document.getElementById('list-search');
    const filter = document.getElementById('list-filter');
    const output = document.getElementById('list-output');
    const count = document.getElementById('result-count');
    if (!search || !output || !count) return;

    const refresh = () => {
      const q = search.value.trim().toLowerCase();
      const f = filter?.value || '';
      let rows = listData(type).filter(x => x.name.toLowerCase().includes(q));
      if (f) {
        if (type === 'items') rows = rows.filter(x => x.type === f);
        if (type === 'monsters') rows = rows.filter(x => x.race === f);
        if (type === 'quests') rows = rows.filter(x => x.type === f);
        if (type === 'skills') rows = rows.filter(x => x.classId === f);
        if (type === 'maps') rows = rows.filter(x => x.type === f);
      }
      count.textContent = `${rows.length} ${t('results')}`;
      output.innerHTML = renderListTable(type, rows);
    };
    search.addEventListener('input', refresh);
    filter?.addEventListener('change', refresh);
    refresh();
  }

  function entityCell(name, href, iconName) {
    return `<div class="table-entity"><span class="tiny-entity-icon">${icon(iconName)}</span><a class="table-link" href="${href}">${esc(name)}</a></div>`;
  }

  function renderListTable(type, rows) {
    if (!rows.length) return `<div class="empty">${t('noResults')}</div>`;
    if (type === 'monsters') return `<div class="table-wrap"><table><thead><tr><th>${t('name')}</th><th>${t('level')}</th><th>${t('race')}</th><th>${t('element')}</th><th>${t('size')}</th><th>${t('baseExp')}</th><th>${t('jobExp')}</th><th>${t('status')}</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${entityCell(m.name,`#/monsters/${m.id}`,'monster')}</td><td>${val(m.level)}</td><td>${esc(m.race)}</td><td>${esc(m.element)}</td><td>${esc(m.size)}</td><td>${val(m.baseExp)}</td><td>${val(m.jobExp)}</td><td>${badge(m.verified)}</td></tr>`).join('')}</tbody></table></div>`;
    if (type === 'items' || type === 'cards') return `<div class="table-wrap"><table><thead><tr><th>${t('name')}</th><th>${t('type')}</th><th>${t('subtype')}</th><th>${t('slot')}</th><th>${t('requiredLevel')}</th><th>${t('status')}</th></tr></thead><tbody>${rows.map(i=>`<tr><td>${entityCell(i.name,`${type==='cards'?'#/cards/':'#/items/'}${i.id}`,i.type==='Card'?'card':'item')}</td><td>${esc(i.type)}</td><td>${esc(i.subtype || t('unknown'))}</td><td>${esc(i.equipmentSlot || t('unknown'))}</td><td>${val(i.requiredLevel)}</td><td>${badge(i.verified)}</td></tr>`).join('')}</tbody></table></div>`;

  function imagePlaceholder(iconName) {

  function infoRow(label, value) { return `<tr><th>${esc(label)}</th><td>${value}</td></tr>`; }
  function statCell(label, value) { return `<div class="stat-cell"><small>${esc(label)}</small><strong>${esc(val(value))}</strong></div>`; }
  function toc(entries) {
    const visibleEntries = entries.filter(x => x.id !== 'sources');
    return `<nav class="toc"><div class="toc-title">${t('contents')}</div><ol>${visibleEntries.map(x=>`<li><a href="#${x.id}">${esc(x.label)}</a></li>`).join('')}</ol></nav>`;

  function skillDetail(id) {
    if (id === 'frost-driver') id = 'frost-diver';
    const sk = getSkill(id);
    if (!sk) return notFound();
    if (id === 'basic-skill') return basicSkillDetail();

    const catalystBySkill = {
      'stone-curse': '1 Red Gemstone',
      'safety-wall': '1 Blue Gemstone',
      'stone-fling': '1 Stone',
      'aqua-benedicta': '1 Empty Bottle',
      'warp-portal': '1 Blue Gemstone'
    };
    const catalyst = catalystBySkill[sk.id] || t('none');
    const prereq = sk.prerequisites.length
      ? sk.prerequisites.map((p,index)=>`<tr><td>${entityCell(getSkill(p.skillId)?.name||p.skillId,`#/skills/${p.skillId}`,'skill')}</td><td>${p.level}</td><td>${index===0?esc(catalyst):'—'}</td><td>${badge(p.verified)}</td></tr>`).join('')
      : `<tr><td>${t('none')}</td><td>—</td><td>${esc(catalyst)}</td><td>${badge(sk.verified)}</td></tr>`;

    const media = sk.image
      ? `<div class="infobox-image" style="height:96px"><img src="${sk.image}" alt="${esc(sk.name)}" width="34" height="34"></div>`
      : imagePlaceholder('skill');

    const rows = wikiSkillLevelData(sk.id);
    const hasDetailedLevels = !!rows;
    const summarizeByLevel = (values, fallback) => {
      if (!rows) return fallback;
      const unique = [...new Set(values.map(v=>String(v)))];
      return unique.length <= 1 ? (unique[0] ?? fallback) : navLabel('Variable','Variable');
    };
    const inferredSP = summarizeByLevel(rows ? rows.map(r=>r[2]) : [], val(sk.spCost));
    const inferredRange = summarizeByLevel(rows ? rows.map(r=>r[3]) : [], val(sk.range));
    const inferredCast = summarizeByLevel(rows ? rows.map(r=>r[4]) : [], val(sk.castTime));
    const inferredDelay = summarizeByLevel(rows ? rows.map(r=>r[5]) : [], val(sk.castDelay));
    const inferredCooldown = summarizeByLevel(rows ? rows.map(r=>r[6]) : [], val(sk.cooldown));

    return `${breadcrumbs([{label:t('skills'),href:'#/skills'},{label:sk.name}])}
      <article class="article-with-infobox">
        <div class="article-heading"><h1>${skillIconImg(sk,32)} ${esc(sk.name)}</h1><div class="page-subtitle">${t('fromWiki')}</div></div>
        <aside class="infobox">
          <div class="infobox-title">${esc(sk.name)}<span class="infobox-subtitle">Skill</span></div>
          ${media}
          <table><tbody>
            ${infoRow(t('class'),sk.id==='sword-mastery'
              ? '<a href="#/classes/swordman">Swordman</a> / <a href="#/classes/thief">Thief</a>'
              : `<a href="#/classes/${sk.classId}">${esc(getClass(sk.classId)?.name||sk.classId)}</a>`)}
            ${infoRow(t('type'),esc(sk.type))}
            ${infoRow(t('target'),esc(sk.target||t('unknown')))}
            ${infoRow(navLabel('Element','Élément'),esc(sk.element||'Neutral'))}
            ${infoRow(t('maxLevel'),String(sk.maxLevel))}
            ${infoRow(t('spCost'),esc(String(inferredSP)))}
            ${infoRow(navLabel('Range','Portée'),esc(String(inferredRange)))}
            ${infoRow(t('castTime'),esc(String(inferredCast)))}
            ${infoRow(navLabel('Cast Delay','Délai après lancement'),esc(String(inferredDelay)))}
            ${infoRow(t('cooldown'),esc(String(inferredCooldown)))}
            ${infoRow(navLabel('Catalyst','Catalyseur'),esc(catalyst))}
          </tbody></table>
          <div class="infobox-footer">${badge(sk.verified)}</div>
        </aside>

        <div class="article-body">
          <p class="article-lead">${esc(sk.classId==='swordman' && hasDetailedLevels ? swordmanSkillExtraText(sk) : txt(sk.description))}</p>
          ${toc([
            ...(hasDetailedLevels ? [{id:'levels',label:navLabel('Level-by-level effects','Effets par niveau')}] : []),
            {id:'formula',label:navLabel('Damage formula','Formule des dégâts')},
            {id:'prereq',label:t('prerequisites')},
            {id:'notes',label:t('notes')},
            ...(hasDetailedLevels ? [{id:'sources',label:navLabel('Sources','Sources')}] : [])
          ])}

          ${hasDetailedLevels ? detailedSkillLevelTable(sk) : ''}

          ${skillDamageFormulaBlock(sk)}

          <h2 id="prereq">${t('prerequisites')}</h2>
          <div class="table-wrap"><table><thead><tr><th>${t('skills')}</th><th>${t('level')}</th><th>${navLabel('Catalyst','Catalyseur')}</th><th>${t('status')}</th></tr></thead><tbody>${prereq}</tbody></table></div>

          <h2 id="notes">${t('notes')}</h2>
          <div class="notes-box">${esc(txt(sk.notes))}</div>

          ${sk.id==='first-aid' ? `<h2>${navLabel('Skill Level','Niveau de compétence')}</h2><div class="table-wrap"><table><thead><tr><th>${navLabel('Skill Level','Niveau')}</th><th>${navLabel('HP Recovered','HP récupérés')}</th><th>${navLabel('SP Consumed','SP consommés')}</th></tr></thead><tbody><tr><td>1</td><td>5</td><td>3</td></tr></tbody></table></div>` : ''}

          ${hasDetailedLevels ? `<h2 id="sources">${navLabel('Sources','Sources')}</h2><div class="source-box"><ul>
            <li><a href="https://midgardhub.com/tools/skills" target="_blank" rel="noopener">MidgardHub — Skill Simulator</a></li>
            <li><a href="${sk.classId==='mage'?'https://roz.prontera.info/skills/planner?class=wizard':(sk.classId==='archer'?'https://roz.prontera.info/skills/planner?class=hunter':(sk.classId==='merchant'?'https://rz.fharr.com/db/skilltree':(sk.classId==='thief'?'https://roz.prontera.info/skills/planner?class=assassin':(sk.classId==='acolyte'?'https://roz.prontera.info/skills/planner?class=high-priest':'https://roz.prontera.info/skills/planner?class=crusader'))))}" target="_blank" rel="noopener">Prontera.info — Skill Planner</a></li>
            <li><a href="https://rz.fharr.com/db/skilltree" target="_blank" rel="noopener">RagZero / fharr — extracted skill-tree reference</a></li>
            ${sk.classId==='mage' ? '<li><a href="https://ragnaplace.com/en/rozg-en/skill/16/stone-curse" target="_blank" rel="noopener">RagnaPlace — fixed / variable / global delay tables</a></li>' : ''}
          </ul></div>` : ''}

          ${skillClassNav(sk)}
        </div>
      </article>`;
  }

  function wireLeveling() {
    const input = document.getElementById('level-input');
    const mult = document.getElementById('exp-mult');
    const out = document.getElementById('level-results');
    if (!input || !mult || !out) return;
    const update = () => {
      const lvl = Number(input.value||1);
      const known = DATA.monsters.filter(m=>typeof m.level==='number').sort((a,b)=>Math.abs(a.level-lvl)-Math.abs(b.level-lvl));
      if (!known.length) { out.innerHTML = `<div class="empty" style="grid-column:1/-1">${t('noVerifiedLevels')}</div>`; return; }
      out.innerHTML = known.slice(0,9).map(m=>`<a class="entity-card" href="#/monsters/${m.id}"><div class="entity-row"><span class="entity-icon">${icon('monster')}</span><div><div class="entity-name">${esc(m.name)}</div><div class="entity-meta">Lv. ${m.level} · ${t('baseExp')}: ${val(m.baseExp)}</div></div></div></a>`).join('');
    };
    input.addEventListener('input',update); mult.addEventListener('change',update); update();
  }

  function buildView() {
    setTimeout(wireBuild,0);
    const stats=['STR','AGI','VIT','INT','DEX','LUK'];
    return `${breadcrumbs([{label:t('buildTitle')}])}${demoAlert()}<div class="article-heading"><h1>${icon('tools')}${t('buildTitle')}</h1><div class="page-subtitle">${t('fromWiki')}</div></div><p>${t('buildText')}</p><section class="panel"><div class="panel-heading">${t('buildPlanner')}</div><div class="panel-body"><div id="build-ranges">${stats.map(s=>`<div class="range-line"><strong>${s}</strong><input data-stat="${s}" type="range" min="1" max="99" value="1"><output>1</output></div>`).join('')}</div><div class="hero-actions"><span class="button">${t('pointsUsed')}: <strong id="points-used">6</strong></span><button id="build-reset" class="button" type="button">${t('reset')}</button></div></div></section>`;
  }

  function wireBuild() {
    const root=document.getElementById('build-ranges'), total=document.getElementById('points-used'), reset=document.getElementById('build-reset');
    if(!root||!total||!reset)return;
    const update=()=>{let sum=0;root.querySelectorAll('input').forEach(input=>{input.nextElementSibling.textContent=input.value;sum+=Number(input.value);});total.textContent=sum;};
    root.addEventListener('input',update);reset.addEventListener('click',()=>{root.querySelectorAll('input').forEach(i=>i.value=1);update();});update();
  }

  function notFound() {
    return `${breadcrumbs([{label:t('notFound')}])}<div class="article-heading"><h1>${icon('warning')}${t('notFound')}</h1></div><p>${t('notFoundText')}</p><a class="button" href="#/">${t('back')}</a>`;
  }

  function render() {
    const hash=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
    let html='';
    if(!hash.length) html=homeView();
    else if(hash[0]==='monsters'&&hash[1]) html=monsterDetail(hash[1]);
    else if(hash[0]==='items'&&hash[1]) html=itemDetail(hash[1],false);
    else if(hash[0]==='cards'&&hash[1]) html=itemDetail(hash[1],true);
    else if(hash[0]==='maps'&&hash[1]) html=mapDetail(hash[1]);
    else if(hash[0]==='skills'&&hash[1]) html=skillDetail(hash[1]);
    else if(hash[0]==='classes'&&hash[1]) html=classDetail(hash[1]);
    else if(hash[0]==='quests'&&hash[1]) html=questDetail(hash[1]);
    else if(hash[0]==='npcs'&&hash[1]) html=npcDetail(hash[1]);
    else if(hash[0]==='guides'&&hash[1]) html=guideDetail(hash[1]);
    else if(hash[0]==='classes'&&!hash[1]) html=classIndexView();
    else if(hash[0]==='wiki'&&hash[1]) html=topicDetail(hash[1]);
    else if(hash[0]==='skills'&&!hash[1]) html=skillsOverviewPage();
    else if(hash[0]==='items'&&!hash[1]) html=itemsOverviewPage();
    else if(hash[0]==='cards'&&!hash[1]) html=cardsOverviewPage();
    else if(hash[0]==='affixes'&&!hash[1]) html=affixDatabasePage();
    else if(hash[0]==='memorial-dungeons'&&!hash[1]) html=memorialDungeonDatabasePage();
    else if(hash[0]==='monsters'&&!hash[1]) html=monstersOverviewPage();
    else if(hash[0]==='maps'&&!hash[1]) html=worldMapPage();
    else if(['quests','npcs'].includes(hash[0])) html=listView(hash[0]);
    else if(hash[0]==='leveling') html=levelingView();
    else if(hash[0]==='tools'&&hash[1]==='build-planner') html=buildView();
    else html=notFound();
    app.innerHTML=html;
    decorateSectionStatusPills();
    wireNaviCopy();
    updateActiveNav();
    app.focus({preventScroll:true});
    const sectionTarget = hash[2] === 'section' ? hash[3] : null;
    if (sectionTarget) {
      requestAnimationFrame(() => document.getElementById(sectionTarget)?.scrollIntoView({behavior:'smooth',block:'start'}));
    } else {
      window.scrollTo(0,0);
    }
  }

  function searchableEntities() {
    return [
      ...DATA.monsters.map(x=>({name:x.name,type:t('monsters'),icon:'monster',href:`#/monsters/${x.id}`})),
      ...DATA.items.map(x=>({name:x.name,type:x.type==='Card'?t('cards'):t('items'),icon:x.type==='Card'?'card':'item',href:x.type==='Card'?`#/cards/${x.id}`:`#/items/${x.id}`})),
      ...DATA.maps.map(x=>({name:x.name,type:t('maps'),icon:'map',href:`#/maps/${x.id}`})),
      ...DATA.skills.map(x=>({name:x.name,type:t('skills'),icon:'skill',href:`#/skills/${x.id}`})),
      ...DATA.classes.map(x=>({name:x.name,type:t('classes'),icon:'class',href:`#/classes/${x.id}`})),
      ...DATA.quests.map(x=>({name:x.name,type:t('quests'),icon:'quest',href:`#/quests/${x.id}`})),
      ...DATA.npcs.map(x=>({name:x.name,type:t('npcs'),icon:'npc',href:`#/npcs/${x.id}`})),
      {name:navLabel('Affix Database','Base des affixes'),type:t('database'),icon:'item',href:'#/affixes'},
      {name:navLabel('Memorial Dungeons','Mémorial Donjon'),type:t('database'),icon:'map',href:'#/memorial-dungeons'},
      ...DATA.guides.map(x=>({name:txt(x.title),type:t('guides'),icon:x.icon||'guide',href:`#/guides/${x.id}`})),
      ...TOPICS.map(x=>({name:lang==='fr'?x.fr:x.en,type:navLabel('Wiki topic','Sujet wiki'),icon:x.icon || 'guide',href:topicHref(x)}))
    ];
  }

  function updateSuggestions() {
    const q=globalSearch.value.trim().toLowerCase();
    if(!q){suggestions.classList.add('hidden');return;}
    const results=searchableEntities().filter(x=>x.name.toLowerCase().includes(q)).slice(0,10);
    suggestions.innerHTML=results.length?results.map(r=>`<a class="search-result" href="${r.href}"><span class="search-result-left">${miniIcon(r.icon)}<strong>${esc(r.name)}</strong></span><small>${esc(r.type)}</small></a>`).join(''):`<div class="search-result"><small>${t('noResults')}</small></div>`;
    suggestions.classList.remove('hidden');
  }

  langToggle.addEventListener('click',()=>setLanguage(lang==='en'?'fr':'en'));
  globalSearch.addEventListener('input',updateSuggestions);
  globalSearch.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const q=globalSearch.value.trim().toLowerCase();
      const result=searchableEntities().find(x=>x.name.toLowerCase().includes(q));
      if(result){location.hash=result.href;globalSearch.value='';suggestions.classList.add('hidden');}
    }
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.global-search-wrap'))suggestions.classList.add('hidden');});
  window.addEventListener('hashchange',()=>{suggestions.classList.add('hidden');render();});


  function closeMobileMenu() {
    document.body.classList.remove('sidebar-open');
    mobileMenuToggle?.setAttribute('aria-expanded','false');
  }

  mobileMenuToggle?.addEventListener('click', () => {
    const open = document.body.classList.toggle('sidebar-open');
    mobileMenuToggle.setAttribute('aria-expanded', String(open));
  });
  nav?.addEventListener('click', event => {
    if (event.target.closest('a') && window.matchMedia('(max-width: 820px)').matches) closeMobileMenu();
  });
  document.addEventListener('keydown', event => {
    if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '') && !document.activeElement?.isContentEditable) {
      event.preventDefault();
      globalSearch?.focus();
      globalSearch?.select();
    }
    if (event.key === 'Escape') {
      suggestions?.classList.add('hidden');
      closeMobileMenu();
    }
  });
  setLanguage(lang);
})();

</script>
<script>
(() => {
  const app = document.getElementById('app');
  const langToggle = document.getElementById('lang-toggle');
  const langEnButton = document.getElementById('lang-en-btn');
  const langFrButton = document.getElementById('lang-fr-btn');
  const editToggle = document.getElementById('edit-toggle');
  const editActions = document.getElementById('edit-actions');
  const saveButton = document.getElementById('edit-save');
  const cancelButton = document.getElementById('edit-cancel');
  const resetButton = document.getElementById('edit-reset');
  const exportButton = document.getElementById('backup-export');
  const importButton = document.getElementById('backup-import');
  const backupFile = document.getElementById('backup-file');
  const linkLanguagesButton = document.getElementById('link-languages');
  const spriteEditorOpen = document.getElementById('sprite-editor-open');

  if (!app || !editToggle) return;

  const TEXT_PREFIX = 'rz-edit:v1:';
  const IMAGE_PREFIX = 'rz-image:v1:';
  const MAX_IMAGE_BYTES = 900 * 1024;
  const LINK_PREF = 'rz-editor-link-languages';
  const SPRITE_PREFIX = 'rz-sprite:v7:';
  const FREE_SPRITE_PREFIX = 'rz-free-sprite:v7:';
  let spritePanel = null;
  let spriteSelection = null;
  let spritePlaceSrc = '';
  let spriteDrag = null;

  let editMode = false;
  let linkLanguages = localStorage.getItem(LINK_PREF) !== 'false';
  let applying = false;
  let refreshTimer = 0;
  const initialState = new Map();
  const dirtyKeys = new Set();

  const labels = {
    en: {
      edit: '✎ Edit page', save: 'Save', cancel: 'Cancel', reset: 'Reset page',
      linked: '🔗 FR ↔ EN linked', unlinked: '🔓 Separate languages',
      linkedHint: 'Language linking is ON: text saved here is copied to both French and English. It is not automatically translated.',
      backup: '⇩ Backup', restore: '⇧ Restore', editing: 'Editing English',
      saved: 'Page saved in this browser.', linkedSaved: 'Saved to French and English. The same text was copied to both languages.', cancelled: 'Changes cancelled.',
      resetConfirm: 'Reset the English edits and custom image for this page?', resetDone: 'Page reset.',
      imageHint: 'Click to add / replace sprite', imageRemove: 'Remove image',
      imageType: 'Choose a PNG, JPG, WebP or GIF image.', imageTooLarge: 'This image is too large. Use an image under 900 KB.',
      imageSaved: 'Image added. Save the page text separately if you edited it.',
      exportDone: 'Backup exported.', importDone: 'Backup restored. The page will refresh.',
      importError: 'This backup file is invalid.', quota: 'Browser storage is full. Export a backup and use smaller images.'
    },
    fr: {
      edit: '✎ Modifier la page', save: 'Enregistrer', cancel: 'Annuler', reset: 'Réinitialiser',
      linked: '🔗 FR ↔ EN liés', unlinked: '🔓 Langues séparées',
      linkedHint: 'La liaison des langues est activée : le texte enregistré ici est copié en français ET en anglais. Il n’est pas traduit automatiquement.',
      backup: '⇩ Sauvegarde', restore: '⇧ Restaurer', editing: 'Édition en français',
      saved: 'Page enregistrée dans ce navigateur.', linkedSaved: 'Enregistré en français et en anglais. Le même texte a été copié dans les deux langues.', cancelled: 'Modifications annulées.',
      resetConfirm: 'Réinitialiser les modifications françaises et l’image personnalisée de cette page ?', resetDone: 'Page réinitialisée.',
      imageHint: 'Cliquer pour ajouter / remplacer le sprite', imageRemove: 'Supprimer l’image',
      imageType: 'Choisis une image PNG, JPG, WebP ou GIF.', imageTooLarge: 'Cette image est trop lourde. Utilise une image de moins de 900 Ko.',
      imageSaved: 'Image ajoutée. Si tu as aussi modifié du texte, pense à enregistrer la page.',
      exportDone: 'Sauvegarde exportée.', importDone: 'Sauvegarde restaurée. La page va être actualisée.',
      importError: 'Ce fichier de sauvegarde est invalide.', quota: 'Le stockage du navigateur est plein. Exporte une sauvegarde et utilise des images plus petites.'
    }
  };

  const getLang = () => document.documentElement.lang === 'fr' ? 'fr' : 'en';
  const L = key => labels[getLang()][key] || labels.en[key] || key;
  const routeKey = () => location.hash || '#/';

  function toast(message) {
    let node = document.getElementById('editor-toast');
    if (!node) {
      node = document.createElement('div');
      node.id = 'editor-toast';
      node.className = 'editor-toast';
      document.body.appendChild(node);
    }
    node.textContent = message;
    node.classList.add('show');
    clearTimeout(node._timer);
    node._timer = setTimeout(() => node.classList.remove('show'), 2400);
  }

  function updateLabels() {
    editToggle.textContent = editMode ? L('editing') : L('edit');
    saveButton.textContent = L('save');
    cancelButton.textContent = L('cancel');
    resetButton.textContent = L('reset');
    exportButton.textContent = L('backup');
    importButton.textContent = L('restore');
    document.querySelectorAll('.image-edit-hint').forEach(x => x.textContent = L('imageHint'));
    document.querySelectorAll('.image-remove-button').forEach(x => x.title = L('imageRemove'));
    langEnButton?.classList.toggle('active', getLang() === 'en');
    langFrButton?.classList.toggle('active', getLang() === 'fr');
    if (linkLanguagesButton) {
      linkLanguagesButton.textContent = linkLanguages ? L('linked') : L('unlinked');
      linkLanguagesButton.classList.toggle('active', linkLanguages);
      linkLanguagesButton.setAttribute('aria-pressed', String(linkLanguages));
      linkLanguagesButton.title = linkLanguages ? L('linkedHint') : '';
    }
    updateSpriteUi();
  }

  function getEditableElements() {
    const selectors = [
      '.article-heading h1',
      '.article-lead',
      '.main-content > p',
      '.main-content > h2',
      '.main-content > h3',
      '.main-content > ul > li',
      '.article-body > p',
      '.article-body > h2',
      '.article-body > h3',
      '.article-body > ul > li',
      '.article-body > ol > li',
      '.article-body > .notes-box',
      '.faq-item > h2',
      '.faq-item > p',
      '.wiki-feature-list p',
      '.wiki-callout p',
      '.wiki-callout li',
      '.verified-topic-note > div',
      '.notice > div',
      '.classic-welcome > h1',
      '.classic-welcome > p',
      '.zero-scope-note',
      '.classic-topic-box > h2',
      '.glossary-table td',
      '.source-box > strong',
      '.source-box li'
    ];
    return [...new Set([...app.querySelectorAll(selectors.join(','))])].filter(el => !el.closest('.toc, .breadcrumbs, .filters, .search-suggestions'));
  }

  function domPath(element) {
    const parts = [];
    let node = element;
    while (node && node !== app) {
      if (node.id) {
        parts.unshift(`#${node.id}`);
        break;
      }
      const parent = node.parentElement;
      if (!parent) break;
      const index = [...parent.children].indexOf(node) + 1;
      parts.unshift(`${node.tagName.toLowerCase()}:nth-child(${index})`);
      node = parent;
    }
    return parts.join('>');
  }

  function textStorageKey(path, language = getLang()) {
    return `${TEXT_PREFIX}${language}:${encodeURIComponent(routeKey())}:${encodeURIComponent(path)}`;
  }

  function applyTextOverrides() {
    if (editMode) return;
    applying = true;
    try {
      getEditableElements().forEach(el => {
        const path = domPath(el);
        const key = textStorageKey(path);
        el.dataset.rzEditKey = key;
        const value = localStorage.getItem(key);
        if (value !== null && el.innerHTML !== value) el.innerHTML = value;
      });
    } finally {
      applying = false;
    }
  }

  function imageStorageKey(slot) {
    return `${IMAGE_PREFIX}${slot.dataset.imageKey || routeKey()}`;
  }

  function applyImages() {
    document.querySelectorAll('.editable-image-slot').forEach(slot => {
      const image = slot.querySelector('.custom-sprite');
      const placeholder = slot.querySelector('.image-placeholder-content');
      const value = localStorage.getItem(imageStorageKey(slot));
      const defaultSrc = slot.dataset.defaultSrc || '';
      if (value && image) {
        image.src = value;
        image.classList.remove('hidden');
        placeholder?.classList.add('hidden');
      } else if (defaultSrc && image) {
        image.src = defaultSrc;
        image.classList.remove('hidden');
        placeholder?.classList.add('hidden');
      } else if (image) {
        image.removeAttribute('src');
        image.classList.add('hidden');
        placeholder?.classList.remove('hidden');
      }
      if (!slot.querySelector('.image-remove-button')) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'image-remove-button';
        remove.textContent = '×';
        remove.title = L('imageRemove');
        slot.appendChild(remove);
      }
      slot.classList.toggle('image-editable-active', editMode);
    });
  }

  function preparePage() {
    if (applying) return;
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      applyTextOverrides();
      applyImages();
      applyUniversalSprites();
      updateLabels();
    }, 0);
  }

  function enterEditMode() {
    if (editMode) return;
    editMode = true;
    initialState.clear();
    dirtyKeys.clear();
    getEditableElements().forEach(el => {
      const path = domPath(el);
      const key = textStorageKey(path);
      el.dataset.rzEditKey = key;
      initialState.set(key, el.innerHTML);
      el.contentEditable = 'true';
      el.spellcheck = true;
      el.classList.add('rz-content-editable');
    });
    app.classList.add('wiki-edit-mode');
    editToggle.classList.add('active');
    editActions.classList.remove('hidden');
    langToggle.disabled = true;
    if (langEnButton) langEnButton.disabled = true;
    if (langFrButton) langFrButton.disabled = true;
    applyImages();
    applyUniversalSprites();
    updateLabels();
  }

  function leaveEditMode() {
    editMode = false;
    app.classList.remove('wiki-edit-mode');
    editToggle.classList.remove('active');
    editActions.classList.add('hidden');
    langToggle.disabled = false;
    if (langEnButton) langEnButton.disabled = false;
    if (langFrButton) langFrButton.disabled = false;
    app.querySelectorAll('[contenteditable="true"]').forEach(el => {
      el.removeAttribute('contenteditable');
      el.classList.remove('rz-content-editable');
    });
    applyImages();
    spritePlaceSrc = '';
    spriteSelection = null;
    app.classList.remove('rz-sprite-editing', 'rz-sprite-place-mode');
    spritePanel && spritePanel.classList.add('hidden');
    applyUniversalSprites();
    updateLabels();
  }

  function saveEdits() {
    try {
      dirtyKeys.forEach(key => {
        const el = [...app.querySelectorAll('[data-rz-edit-key]')].find(node => node.dataset.rzEditKey === key);
        if (!el) return;
        const path = domPath(el);
        const html = el.innerHTML;
        if (linkLanguages) {
          localStorage.setItem(textStorageKey(path, 'fr'), html);
          localStorage.setItem(textStorageKey(path, 'en'), html);
        } else {
          localStorage.setItem(textStorageKey(path, getLang()), html);
        }
      });
      leaveEditMode();
      toast(linkLanguages ? L('linkedSaved') : L('saved'));
    } catch (error) {
      console.error(error);
      toast(L('quota'));
    }
  }

  function cancelEdits() {
    getEditableElements().forEach(el => {
      const key = el.dataset.rzEditKey;
      if (key && initialState.has(key)) el.innerHTML = initialState.get(key);
    });
    leaveEditMode();
    toast(L('cancelled'));
  }

  function resetPage() {
    if (!confirm(L('resetConfirm'))) return;
    const languages = linkLanguages ? ['fr','en'] : [getLang()];
    languages.forEach(language => {
      const prefix = `${TEXT_PREFIX}${language}:${encodeURIComponent(routeKey())}:`;
      Object.keys(localStorage).filter(key => key.startsWith(prefix)).forEach(key => localStorage.removeItem(key));
    });
    document.querySelectorAll('.editable-image-slot').forEach(slot => localStorage.removeItem(imageStorageKey(slot)));
    const spriteRoutePrefix = SPRITE_PREFIX + encodeURIComponent(routeKey()) + ':';
    Object.keys(localStorage).filter(key => key.startsWith(spriteRoutePrefix)).forEach(key => localStorage.removeItem(key));
    localStorage.removeItem(freeSpriteKey());
    leaveEditMode();
    toast(L('resetDone'));
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  }

  function pickImage(slot) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/png,image/jpeg,image/webp,image/gif';
    input.addEventListener('change', () => {
      const file = input.files?.[0];
      if (!file) return;
      if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) {
        alert(L('imageType'));
        return;
      }
      if (file.size > MAX_IMAGE_BYTES) {
        alert(L('imageTooLarge'));
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        try {
          localStorage.setItem(imageStorageKey(slot), String(reader.result));
          applyImages();
          toast(L('imageSaved'));
        } catch (error) {
          console.error(error);
          alert(L('quota'));
        }
      };
      reader.readAsDataURL(file);
    }, { once: true });
    input.click();
  }


  function spriteText(key) {
    const fr = getLang() === 'fr';
    const values = {
      title: fr ? 'Éditeur de sprites' : 'Sprite editor',
      none: fr ? 'Aucun sprite sélectionné.' : 'No sprite selected.',
      existing: fr ? 'Sprite existant sélectionné.' : 'Existing sprite selected.',
      free: fr ? 'Sprite ajouté sélectionné. Tu peux le déplacer à la souris.' : 'Added sprite selected. You can drag it with the mouse.',
      add: fr ? '+ Ajouter' : '+ Add',
      replace: fr ? 'Remplacer' : 'Replace',
      smaller: fr ? '− Réduire' : '− Smaller',
      larger: fr ? '+ Agrandir' : '+ Larger',
      reset: fr ? 'Réinitialiser' : 'Reset',
      remove: fr ? 'Supprimer' : 'Delete',
      close: fr ? 'Fermer' : 'Close',
      place: fr ? 'Clique maintenant où tu veux placer le sprite.' : 'Now click where you want to place the sprite.',
      saved: fr ? 'Sprite enregistré.' : 'Sprite saved.',
      help: fr
        ? 'Clique sur une image encadrée en bleu pour la modifier. “+ Ajouter” permet de choisir une image puis de la poser où tu veux. Les sprites ajoutés se déplacent à la souris. Les changements sont gardés dans ce navigateur et inclus dans Sauvegarde / Restaurer.'
        : 'Click a blue-outlined image to edit it. “+ Add” lets you choose an image and place it anywhere. Added sprites can be dragged. Changes are stored in this browser and included in Backup / Restore.'
    };
    return values[key] || key;
  }

  function ensureSpritePanel() {
    if (spritePanel) return spritePanel;
    spritePanel = document.createElement('section');
    spritePanel.className = 'sprite-editor-panel hidden';
    spritePanel.innerHTML =
      '<h3 id="sprite-panel-title"></h3>' +
      '<p id="sprite-panel-status" class="sprite-editor-status"></p>' +
      '<div class="sprite-editor-actions">' +
        '<button id="sprite-add" class="sprite-add" type="button"></button>' +
        '<button id="sprite-replace" type="button"></button>' +
        '<button id="sprite-smaller" type="button"></button>' +
        '<button id="sprite-larger" type="button"></button>' +
        '<button id="sprite-reset" class="sprite-danger" type="button"></button>' +
        '<button id="sprite-close" type="button"></button>' +
      '</div>' +
      '<p id="sprite-help" class="sprite-editor-help"></p>';
    document.body.appendChild(spritePanel);

    spritePanel.querySelector('#sprite-add').addEventListener('click', beginSpritePlacement);
    spritePanel.querySelector('#sprite-replace').addEventListener('click', replaceSpriteSelection);
    spritePanel.querySelector('#sprite-smaller').addEventListener('click', function(){ resizeSpriteSelection(0.85); });
    spritePanel.querySelector('#sprite-larger').addEventListener('click', function(){ resizeSpriteSelection(1.15); });
    spritePanel.querySelector('#sprite-reset').addEventListener('click', resetSpriteSelection);
    spritePanel.querySelector('#sprite-close').addEventListener('click', function(){ spritePanel.classList.add('hidden'); });
    updateSpriteUi();
    return spritePanel;
  }

  function updateSpriteUi() {
    if (spriteEditorOpen) spriteEditorOpen.textContent = '🖼 Sprites';
    if (!spritePanel) return;
    spritePanel.querySelector('#sprite-panel-title').textContent = spriteText('title');
    spritePanel.querySelector('#sprite-add').textContent = spriteText('add');
    spritePanel.querySelector('#sprite-replace').textContent = spriteText('replace');
    spritePanel.querySelector('#sprite-smaller').textContent = spriteText('smaller');
    spritePanel.querySelector('#sprite-larger').textContent = spriteText('larger');
    spritePanel.querySelector('#sprite-close').textContent = spriteText('close');
    spritePanel.querySelector('#sprite-help').textContent = spriteText('help');
    refreshSpritePanel();
  }

  function spriteKey(element) {
    return SPRITE_PREFIX + encodeURIComponent(routeKey()) + ':' + encodeURIComponent(domPath(element));
  }

  function freeSpriteKey() {
    return FREE_SPRITE_PREFIX + encodeURIComponent(routeKey());
  }

  function readFreeSprites() {
    try {
      const value = JSON.parse(localStorage.getItem(freeSpriteKey()) || '[]');
      return Array.isArray(value) ? value : [];
    } catch (error) {
      return [];
    }
  }

  function writeFreeSprites(list) {
    localStorage.setItem(freeSpriteKey(), JSON.stringify(list));
  }

  function spriteTargets() {
    const list = app.querySelectorAll('img:not(.rz-free-sprite), .database-category-icon:not(img)');
    return Array.from(new Set(Array.from(list))).filter(function(element){
      return !element.closest('.rz-free-sprite-layer');
    });
  }

  function rememberSpriteOriginal(element) {
    if (element.dataset.rzSpriteOriginal === '1') return;
    element.dataset.rzSpriteOriginal = '1';
    element.dataset.rzOriginalStyle = element.getAttribute('style') || '';
    if (element.tagName === 'IMG') {
      element.dataset.rzHadSrc = element.hasAttribute('src') ? '1' : '0';
      element.dataset.rzOriginalSrc = element.getAttribute('src') || '';
    }
  }

  function restoreSpriteOriginal(element) {
    if (element.tagName === 'IMG') {
      if (element.dataset.rzHadSrc === '1') element.setAttribute('src', element.dataset.rzOriginalSrc || '');
      else element.removeAttribute('src');
    }
    const originalStyle = element.dataset.rzOriginalStyle || '';
    if (originalStyle) element.setAttribute('style', originalStyle);
    else element.removeAttribute('style');
    element.classList.remove('rz-sprite-custom');
  }

  function applySpriteOverrides() {
    spriteTargets().forEach(function(element){
      rememberSpriteOriginal(element);
      element.classList.toggle('rz-sprite-target', editMode);
      const raw = localStorage.getItem(spriteKey(element));
      if (!raw) return;
      let record = null;
      try { record = JSON.parse(raw); } catch (error) {}
      if (!record) return;
      element.classList.add('rz-sprite-custom');
      if (record.src) {
        if (element.tagName === 'IMG') element.src = record.src;
        else element.style.setProperty('background-image', 'url("' + record.src + '")', 'important');
      }
      if (record.width) {
        element.style.setProperty('width', record.width + 'px', 'important');
        element.style.setProperty('min-width', record.width + 'px', 'important');
        element.style.setProperty('max-width', record.width + 'px', 'important');
      }
      if (record.height) {
        element.style.setProperty('height', record.height + 'px', 'important');
        element.style.setProperty('min-height', record.height + 'px', 'important');
        element.style.setProperty('max-height', record.height + 'px', 'important');
      }
      if (element.tagName === 'IMG') element.style.setProperty('object-fit', 'contain', 'important');
    });
  }

  function ensureFreeSpriteLayer() {
    let layer = app.querySelector(':scope > .rz-free-sprite-layer');
    if (!layer) {
      layer = document.createElement('div');
      layer.className = 'rz-free-sprite-layer';
      layer.setAttribute('aria-hidden', 'true');
      app.appendChild(layer);
    }
    return layer;
  }

  function renderFreeSprites() {
    const layer = ensureFreeSpriteLayer();
    const records = readFreeSprites();
    const ids = new Set(records.map(function(record){ return String(record.id); }));

    layer.querySelectorAll('.rz-free-sprite').forEach(function(image){
      if (!ids.has(image.dataset.spriteId)) image.remove();
    });

    records.forEach(function(record){
      let image = Array.from(layer.querySelectorAll('.rz-free-sprite')).find(function(node){
        return node.dataset.spriteId === String(record.id);
      });
      if (!image) {
        image = document.createElement('img');
        image.className = 'rz-free-sprite';
        image.dataset.spriteId = String(record.id);
        image.alt = '';
        image.draggable = false;
        layer.appendChild(image);
      }
      image.src = record.src;
      image.style.left = (Number(record.x) || 0) + 'px';
      image.style.top = (Number(record.y) || 0) + 'px';
      image.style.width = Math.max(8, Number(record.width) || 48) + 'px';
      image.style.height = Math.max(8, Number(record.height) || 48) + 'px';
      image.classList.toggle('rz-sprite-selected', !!spriteSelection && spriteSelection.kind === 'free' && String(spriteSelection.id) === String(record.id));
    });
  }

  function applyUniversalSprites() {
    if (spriteSelection && spriteSelection.kind === 'existing' && !spriteSelection.element.isConnected) spriteSelection = null;
    app.classList.toggle('rz-sprite-editing', editMode);
    applySpriteOverrides();
    renderFreeSprites();
    refreshSpritePanel();
  }

  function openSpritePanel() {
    ensureSpritePanel().classList.remove('hidden');
    refreshSpritePanel();
  }

  function clearSpriteSelectionClasses() {
    spriteTargets().forEach(function(element){ element.classList.remove('rz-sprite-selected'); });
    app.querySelectorAll('.rz-free-sprite').forEach(function(element){ element.classList.remove('rz-sprite-selected'); });
  }

  function selectExistingSprite(element) {
    spriteSelection = { kind: 'existing', element: element };
    clearSpriteSelectionClasses();
    element.classList.add('rz-sprite-selected');
    openSpritePanel();
  }

  function selectFreeSprite(id) {
    spriteSelection = { kind: 'free', id: String(id) };
    clearSpriteSelectionClasses();
    const image = Array.from(app.querySelectorAll('.rz-free-sprite')).find(function(node){
      return node.dataset.spriteId === String(id);
    });
    if (image) image.classList.add('rz-sprite-selected');
    openSpritePanel();
  }

  function getSelectedRecord() {
    if (!spriteSelection) return null;
    if (spriteSelection.kind === 'free') {
      return readFreeSprites().find(function(record){ return String(record.id) === String(spriteSelection.id); }) || null;
    }
    const element = spriteSelection.element;
    if (!element || !element.isConnected) return null;
    const raw = localStorage.getItem(spriteKey(element));
    if (raw) {
      try { return JSON.parse(raw); } catch (error) {}
    }
    const rect = element.getBoundingClientRect();
    return {
      src: element.tagName === 'IMG' ? (element.currentSrc || element.src || '') : '',
      width: Math.max(8, Math.round(rect.width || 40)),
      height: Math.max(8, Math.round(rect.height || 40))
    };
  }

  function refreshSpritePanel() {
    if (!spritePanel) return;
    const status = spritePanel.querySelector('#sprite-panel-status');
    const reset = spritePanel.querySelector('#sprite-reset');
    const disabled = !spriteSelection || !getSelectedRecord();
    spritePanel.querySelector('#sprite-replace').disabled = disabled;
    spritePanel.querySelector('#sprite-smaller').disabled = disabled;
    spritePanel.querySelector('#sprite-larger').disabled = disabled;
    reset.disabled = disabled;
    if (disabled) {
      status.textContent = spriteText('none');
      reset.textContent = spriteText('reset');
    } else if (spriteSelection.kind === 'free') {
      status.textContent = spriteText('free');
      reset.textContent = spriteText('remove');
    } else {
      status.textContent = spriteText('existing');
      reset.textContent = spriteText('reset');
    }
  }

  function chooseSpriteImage(callback) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/png,image/jpeg,image/webp,image/gif';
    input.addEventListener('change', function(){
      const file = input.files && input.files[0];
      if (!file) return;
      if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) {
        alert(L('imageType'));
        return;
      }
      if (file.size > MAX_IMAGE_BYTES) {
        alert(L('imageTooLarge'));
        return;
      }
      const reader = new FileReader();
      reader.onload = function(){ callback(String(reader.result)); };
      reader.readAsDataURL(file);
    }, { once: true });
    input.click();
  }

  function beginSpritePlacement() {
    chooseSpriteImage(function(src){
      spritePlaceSrc = src;
      app.classList.add('rz-sprite-place-mode');
      spritePanel.classList.add('hidden');
      toast(spriteText('place'));
    });
  }

  function placeSpriteAt(event) {
    if (!spritePlaceSrc) return false;
    const rect = app.getBoundingClientRect();
    const list = readFreeSprites();
    const id = String(Date.now()) + '-' + Math.random().toString(36).slice(2,7);
    const width = 48;
    const height = 48;
    list.push({
      id: id,
      src: spritePlaceSrc,
      x: Math.max(0, Math.round(event.clientX - rect.left - width / 2)),
      y: Math.max(0, Math.round(event.clientY - rect.top - height / 2)),
      width: width,
      height: height
    });
    writeFreeSprites(list);
    spritePlaceSrc = '';
    app.classList.remove('rz-sprite-place-mode');
    renderFreeSprites();
    selectFreeSprite(id);
    toast(spriteText('saved'));
    return true;
  }

  function replaceSpriteSelection() {
    if (!spriteSelection) return;
    chooseSpriteImage(function(src){
      if (spriteSelection.kind === 'free') {
        const list = readFreeSprites();
        const record = list.find(function(item){ return String(item.id) === String(spriteSelection.id); });
        if (!record) return;
        record.src = src;
        writeFreeSprites(list);
      } else if (spriteSelection.element && spriteSelection.element.isConnected) {
        const record = getSelectedRecord() || {};
        record.src = src;
        localStorage.setItem(spriteKey(spriteSelection.element), JSON.stringify(record));
      }
      applyUniversalSprites();
      toast(spriteText('saved'));
    });
  }

  function resizeSpriteSelection(factor) {
    if (!spriteSelection) return;
    if (spriteSelection.kind === 'free') {
      const list = readFreeSprites();
      const record = list.find(function(item){ return String(item.id) === String(spriteSelection.id); });
      if (!record) return;
      record.width = Math.max(8, Math.min(800, Math.round((Number(record.width) || 48) * factor)));
      record.height = Math.max(8, Math.min(800, Math.round((Number(record.height) || 48) * factor)));
      writeFreeSprites(list);
    } else if (spriteSelection.element && spriteSelection.element.isConnected) {
      const record = getSelectedRecord() || {};
      record.width = Math.max(8, Math.min(800, Math.round((Number(record.width) || 40) * factor)));
      record.height = Math.max(8, Math.min(800, Math.round((Number(record.height) || 40) * factor)));
      localStorage.setItem(spriteKey(spriteSelection.element), JSON.stringify(record));
    }
    applyUniversalSprites();
  }

  function resetSpriteSelection() {
    if (!spriteSelection) return;
    if (spriteSelection.kind === 'free') {
      const list = readFreeSprites().filter(function(item){ return String(item.id) !== String(spriteSelection.id); });
      writeFreeSprites(list);
      spriteSelection = null;
    } else if (spriteSelection.element && spriteSelection.element.isConnected) {
      localStorage.removeItem(spriteKey(spriteSelection.element));
      restoreSpriteOriginal(spriteSelection.element);
    }
    clearSpriteSelectionClasses();
    applyUniversalSprites();
  }

  function startFreeSpriteDrag(event, image) {
    const list = readFreeSprites();
    const record = list.find(function(item){ return String(item.id) === String(image.dataset.spriteId); });
    if (!record) return;
    spriteDrag = {
      id: String(record.id),
      startX: event.clientX,
      startY: event.clientY,
      originX: Number(record.x) || 0,
      originY: Number(record.y) || 0,
      x: Number(record.x) || 0,
      y: Number(record.y) || 0
    };
    selectFreeSprite(record.id);
    event.preventDefault();
    event.stopImmediatePropagation();
  }

  document.addEventListener('pointermove', function(event){
    if (!spriteDrag) return;
    spriteDrag.x = Math.max(0, Math.round(spriteDrag.originX + event.clientX - spriteDrag.startX));
    spriteDrag.y = Math.max(0, Math.round(spriteDrag.originY + event.clientY - spriteDrag.startY));
    const image = Array.from(app.querySelectorAll('.rz-free-sprite')).find(function(node){
      return node.dataset.spriteId === spriteDrag.id;
    });
    if (image) {
      image.style.left = spriteDrag.x + 'px';
      image.style.top = spriteDrag.y + 'px';
    }
  });

  document.addEventListener('pointerup', function(){
    if (!spriteDrag) return;
    const list = readFreeSprites();
    const record = list.find(function(item){ return String(item.id) === spriteDrag.id; });
    if (record) {
      record.x = spriteDrag.x;
      record.y = spriteDrag.y;
      writeFreeSprites(list);
    }
    spriteDrag = null;
  });

  app.addEventListener('pointerdown', function(event){
    if (!editMode) return;
    const free = event.target.closest && event.target.closest('.rz-free-sprite');
    if (free) startFreeSpriteDrag(event, free);
  }, true);

  app.addEventListener('click', function(event){
    if (!editMode) return;

    if (placeSpriteAt(event)) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }

    const free = event.target.closest && event.target.closest('.rz-free-sprite');
    if (free) {
      selectFreeSprite(free.dataset.spriteId);
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }

    const target = event.target.closest && event.target.closest('img:not(.rz-free-sprite), .database-category-icon:not(img)');
    if (target && app.contains(target) && !target.closest('.rz-free-sprite-layer')) {
      selectExistingSprite(target);
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }, true);

  spriteEditorOpen && spriteEditorOpen.addEventListener('click', function(){
    if (!editMode) return;
    openSpritePanel();
  });


  function exportBackup() {
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      values: {}
    };
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith(TEXT_PREFIX) || key.startsWith(IMAGE_PREFIX) || key.startsWith(SPRITE_PREFIX) || key.startsWith(FREE_SPRITE_PREFIX) || key === 'rz-lang' || key === LINK_PREF) payload.values[key] = localStorage.getItem(key);
    });
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ragnarok-zero-wiki-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast(L('exportDone'));
  }

  function importBackup(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(String(reader.result));
        if (!payload || payload.version !== 1 || typeof payload.values !== 'object') throw new Error('Invalid backup');
        Object.entries(payload.values).forEach(([key, value]) => {
          if (key.startsWith(TEXT_PREFIX) || key.startsWith(IMAGE_PREFIX) || key.startsWith(SPRITE_PREFIX) || key.startsWith(FREE_SPRITE_PREFIX) || key === 'rz-lang' || key === LINK_PREF) localStorage.setItem(key, String(value));
        });
        toast(L('importDone'));
        setTimeout(() => location.reload(), 500);
      } catch (error) {
        console.error(error);
        alert(L('importError'));
      }
    };
    reader.readAsText(file);
  }

  app.addEventListener('input', event => {
    if (!editMode) return;
    const editable = event.target.closest?.('[data-rz-edit-key]');
    if (editable?.dataset.rzEditKey) dirtyKeys.add(editable.dataset.rzEditKey);
  });

  app.addEventListener('click', event => {
    const remove = event.target.closest?.('.image-remove-button');
    if (remove) {
      event.preventDefault();
      event.stopPropagation();
      if (!editMode) return;
      const slot = remove.closest('.editable-image-slot');
      if (slot) {
        localStorage.removeItem(imageStorageKey(slot));
        applyImages();
      }
      return;
    }

    const slot = event.target.closest?.('.editable-image-slot');
    if (slot && editMode) {
      event.preventDefault();
      event.stopPropagation();
      pickImage(slot);
      return;
    }

    if (editMode && event.target.closest?.('a')) {
      event.preventDefault();
    }
  });

  langEnButton?.addEventListener('click', () => { if (getLang() !== 'en') langToggle.click(); });
  langFrButton?.addEventListener('click', () => { if (getLang() !== 'fr') langToggle.click(); });
  linkLanguagesButton?.addEventListener('click', () => {
    linkLanguages = !linkLanguages;
    localStorage.setItem(LINK_PREF, String(linkLanguages));
    updateLabels();
    toast(linkLanguages ? L('linkedHint') : L('unlinked'));
  });
  editToggle.addEventListener('click', () => editMode ? saveEdits() : enterEditMode());
  saveButton.addEventListener('click', saveEdits);
  cancelButton.addEventListener('click', cancelEdits);
  resetButton.addEventListener('click', resetPage);
  exportButton.addEventListener('click', exportBackup);
  importButton.addEventListener('click', () => backupFile.click());
  backupFile.addEventListener('change', () => {
    const file = backupFile.files?.[0];
    if (file) importBackup(file);
    backupFile.value = '';
  });

  window.addEventListener('hashchange', () => {
    if (editMode) leaveEditMode();
    preparePage();
  });

  const pageObserver = new MutationObserver(() => preparePage());
  pageObserver.observe(app, { childList: true, subtree: true });

  const languageObserver = new MutationObserver(() => {
    if (editMode) leaveEditMode();
    updateLabels();
    preparePage();
  });
  languageObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });

  ensureSpritePanel();
  preparePage();
})();

</script>
</body>
</html>
