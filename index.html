<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ragnarok Zero Wiki — bilingual English/French community reference for Ragnarok Zero Global." />
  <title>Ragnarok Zero Wiki</title>
  <style>
:root {
  --wiki-bg: #eef2f5;
  --paper: #fff;
  --paper-soft: #f8f9fa;
  --sidebar: #f4f6f8;
  --text: #202122;
  --muted: #54595d;
  --muted-2: #72777d;
  --line: #a2a9b1;
  --line-soft: #c8ccd1;
  --blue: #3366cc;
  --blue-dark: #2a4b8d;
  --blue-pale: #eaf3ff;
  --gold-pale: #fff8e8;
  --gold-line: #c8a96a;
  --green-pale: #edf8ef;
  --green-line: #79a77e;
  --red-pale: #fff1f1;
  --red-line: #bf7d7d;
  --purple-pale: #f5f0fa;
  --purple-line: #a98ac4;
  --shadow: 0 1px 2px rgba(0,0,0,.08);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background: var(--wiki-bg);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
}
button, input, select { font: inherit; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.hidden { display: none !important; }
.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.icon,
.mini-icon,
.search-icon,
.category-icon svg,
.entity-icon svg,
.infobox-image svg,
.notice-icon svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mini-icon { width: 15px; height: 15px; flex: 0 0 15px; color: #536b88; }
.icon { width: 17px; height: 17px; }

.wiki-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
}

/* Sidebar */
.wiki-sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 20px 17px 28px;
  background: linear-gradient(180deg, #fafbfd 0, var(--sidebar) 155px, #edf1f4 100%);
  border-right: 1px solid var(--line-soft);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 23px;
  color: #1f2c3d;
  text-decoration: none;
}
.brand:hover { text-decoration: none; }
.brand-emblem {
  position: relative;
  width: 57px;
  height: 57px;
  display: grid;
  place-items: center;
  flex: 0 0 57px;
  border: 1px solid #8397ae;
  border-radius: 50%;
  color: #35587d;
  background: radial-gradient(circle at 35% 27%, #fff 0 10%, transparent 11%), linear-gradient(145deg,#f9fcff,#d9e7f5);
  box-shadow: inset 0 0 0 3px #edf4fa, 0 1px 3px rgba(0,0,0,.12);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  font-weight: 700;
}
.brand-emblem::before,
.brand-emblem::after {
  content: "";
  position: absolute;
  top: 23px;
  width: 14px;
  height: 8px;
  border-top: 1px solid #8397ae;
}
.brand-emblem::before { left: -8px; transform: rotate(-22deg); }
.brand-emblem::after { right: -8px; transform: rotate(22deg); }
.brand-copy strong,
.brand-wiki { display: block; font-family: Georgia, "Times New Roman", serif; line-height: 1; }
.brand-copy strong { font-size: 16px; font-weight: 400; }
.brand-wiki { margin-top: 2px; font-size: 25px; }
.brand-copy small { display: block; margin-top: 5px; color: var(--muted-2); font-size: 11px; }

.sidebar-block { margin: 0 0 19px; }
.sidebar-title {
  margin-bottom: 4px;
  padding: 0 5px 5px;
  color: var(--muted);
  border-bottom: 1px solid var(--line-soft);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .35px;
}
.main-nav,
.sidebar-extra { display: block; }
.nav-link,
.sidebar-extra a {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 27px;
  padding: 4px 6px;
  border-left: 2px solid transparent;
  color: var(--blue);
  font-size: 13px;
}
.nav-link.active {
  border-left-color: var(--blue);
  color: var(--text);
  font-weight: 700;
  background: rgba(51,102,204,.065);
}
.nav-link:hover,
.sidebar-extra a:hover { background: rgba(51,102,204,.05); text-decoration: none; }
.sidebar-note {
  margin-top: 26px;
  padding: 11px 5px 0;
  border-top: 1px solid var(--line-soft);
  color: var(--muted-2);
  font-size: 11px;
  line-height: 1.45;
}

/* Header */
.wiki-page { min-width: 0; display: flex; min-height: 100vh; flex-direction: column; }
.site-header {
  min-height: 61px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  padding: 12px 24px 0;
  background: #fff;
  border-bottom: 1px solid var(--line-soft);
}
.page-tools { display: flex; align-self: flex-end; gap: 2px; }
.page-tools span {
  padding: 9px 12px 8px;
  color: var(--muted);
  border: 1px solid transparent;
  border-bottom: 0;
  font-size: 12px;
}
.page-tools span:first-child { color: var(--text); border-color: var(--line-soft); background: #fff; }
.header-actions { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; width: min(660px, 62%); }
.global-search-wrap { position: relative; display: flex; flex: 1; }
.search-icon {
  position: absolute;
  z-index: 2;
  left: 9px;
  top: 8px;
  width: 18px;
  height: 18px;
  color: #72777d;
  pointer-events: none;
}
.global-search-wrap input {
  width: 100%;
  min-width: 0;
  height: 35px;
  padding: 6px 10px 6px 34px;
  border: 1px solid #72777d;
  border-right: 0;
  border-radius: 2px 0 0 2px;
  outline: 0;
  color: var(--text);
  background: #fff;
}
.global-search-wrap input:focus { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.search-button,
.lang-toggle,
.button {
  border: 1px solid var(--line);
  background: #f8f9fa;
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
}
.search-button { height: 35px; padding: 0 14px; border-radius: 0 2px 2px 0; }
.lang-toggle { height: 35px; min-width: 46px; padding: 0 10px; border-radius: 2px; }
.search-button:hover,
.lang-toggle:hover,
.button:hover { background: #fff; border-color: #72777d; text-decoration: none; }
.search-suggestions {
  position: absolute;
  z-index: 50;
  top: 37px;
  left: 0;
  right: 0;
  max-height: 430px;
  overflow: auto;
  padding: 4px 0;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: 0 3px 8px rgba(0,0,0,.18);
}
.search-result {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 8px 10px;
  color: var(--text);
}
.search-result:hover { background: #eaecf0; text-decoration: none; }
.search-result-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.search-result small { color: var(--muted-2); }

/* Content base */
.main-content {
  width: calc(100% - 40px);
  max-width: 1440px;
  margin: 20px auto 42px;
  padding: 24px 30px 40px;
  flex: 1;
  border: 1px solid var(--line-soft);
  background: var(--paper);
  box-shadow: var(--shadow);
}
h1, h2, h3, h4 { color: var(--text); }
h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
h1 { margin: 0 0 3px; font-size: 31px; line-height: 1.25; }
h2 {
  margin: 29px 0 12px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
  font-size: 23px;
  line-height: 1.3;
}
h3 { margin: 22px 0 8px; font-size: 16px; }
h4 { margin: 13px 0 7px; font-size: 14px; }
p { margin: 8px 0 12px; line-height: 1.58; }
ul, ol { line-height: 1.58; }
.eyebrow { display: block; margin-bottom: 2px; color: var(--muted-2); font-size: 12px; }
.page-subtitle { margin: 0 0 17px; color: var(--muted); font-size: 12px; }
.breadcrumbs { margin-bottom: 8px; color: var(--muted-2); font-size: 12px; }
.breadcrumbs a { color: var(--blue); }

.notice {
  display: flex;
  gap: 10px;
  margin: 13px 0 18px;
  padding: 9px 12px;
  border: 1px solid var(--gold-line);
  background: var(--gold-pale);
  color: #4b3b20;
  line-height: 1.45;
}
.notice-icon { width: 19px; height: 19px; flex: 0 0 19px; color: #8b6a2a; }
.notice strong { color: var(--text); }
.notice.info { border-color: #8daac9; background: #f1f7fd; color: #334c65; }
.notice.info .notice-icon { color: #4b739c; }

.panel {
  border: 1px solid var(--line-soft);
  border-radius: 0;
  background: #fff;
}
.panel-body { padding: 14px 16px; }
.panel-heading {
  padding: 7px 10px;
  border-bottom: 1px solid var(--line-soft);
  background: #eaecf0;
  font-weight: 700;
}

/* Main page, classic wiki portal */
.welcome-box {
  display: grid;
  grid-template-columns: minmax(0,1fr) 245px;
  gap: 0;
  margin-bottom: 12px;
  border: 1px solid #8eaac6;
  background: #f5faff;
}
.welcome-main { padding: 16px 19px; }
.welcome-main h1 { font-size: 30px; }
.welcome-main p { max-width: 850px; color: #374151; }
.welcome-stats {
  padding: 13px 15px;
  border-left: 1px solid #b7c9db;
  background: #edf5fc;
}
.welcome-stats h3 { margin: 0 0 6px; padding-bottom: 5px; border-bottom: 1px solid #b7c9db; }
.statline { display: flex; justify-content: space-between; gap: 12px; padding: 4px 1px; font-size: 12px; }
.statline strong { font-size: 13px; }

.portal-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
  align-items: start;
}
.portal-box { border: 1px solid var(--line); background: #fff; }
.portal-title {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  background: #eaf3ff;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
}
.portal-box:nth-child(3n+2) .portal-title { background: #edf7ee; }
.portal-box:nth-child(3n) .portal-title { background: #f6f0fa; }
.portal-title svg { width: 22px; height: 22px; color: #4f6985; }
.portal-content { padding: 10px 12px 11px; }
.portal-links {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 7px 14px;
}
.portal-link {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  min-width: 0;
  line-height: 1.35;
}
.portal-link .mini-icon { margin-top: 1px; }
.portal-link small { display: block; color: var(--muted-2); font-size: 11px; margin-top: 1px; }
.portal-note { margin: 7px 0 0; color: var(--muted); font-size: 12px; }

/* Lists */
.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}
.section-header h1,
.section-header h2 { margin-bottom: 0; }
.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 9px;
  margin: 10px 0 14px;
  padding: 10px;
  border: 1px solid var(--line-soft);
  background: #f8f9fa;
}
.form-field { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.form-field label { color: var(--muted); font-size: 11px; font-weight: 700; }
.input,
.select {
  height: 32px;
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: #fff;
  color: var(--text);
}
.input:focus,
.select:focus { outline: 1px solid var(--blue); border-color: var(--blue); }
.result-count { color: var(--muted-2); font-size: 12px; margin-bottom: 6px; }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 8px; border: 1px solid var(--line-soft); text-align: left; vertical-align: middle; }
th { background: #eaecf0; color: var(--text); font-weight: 700; }
tbody tr:nth-child(even) { background: #f8f9fa; }
tbody tr:hover { background: #eef4fb; }
.table-link { font-weight: 600; }
.table-entity { display: flex; align-items: center; gap: 8px; }
.tiny-entity-icon {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  flex: 0 0 27px;
  border: 1px solid var(--line-soft);
  background: #fff;
  color: #5d7188;
}
.tiny-entity-icon svg { width: 17px; height: 17px; }
.badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 21px;
  padding: 2px 6px;
  border: 1px solid #a2a9b1;
  background: #f8f9fa;
  color: #54595d;
  font-size: 11px;
  font-weight: 600;
}
.badge.verified { border-color: var(--green-line); background: var(--green-pale); color: #315f37; }
.badge.unverified { border-color: var(--gold-line); background: var(--gold-pale); color: #745a22; }
.badge.danger { border-color: var(--red-line); background: var(--red-pale); color: #783e3e; }

.section-status-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 22px;
  margin-left: 9px;
  padding: 2px 9px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 10px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: .025em;
  vertical-align: middle;
  white-space: nowrap;
  transform: translateY(-2px);
}
.section-status-pill.status-complete {
  border-color: var(--green-line);
  background: var(--green-pale);
  color: #315f37;
}
.section-status-pill.status-partial {
  border-color: var(--gold-line);
  background: var(--gold-pale);
  color: #745a22;
}
.section-status-pill.status-missing {
  border-color: var(--red-line);
  background: var(--red-pale);
  color: #783e3e;
}
.empty { padding: 16px; border: 1px dashed var(--line); background: #f8f9fa; color: var(--muted); text-align: center; }

/* Article / detail page */
.article-heading { margin-bottom: 9px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
.article-heading h1 { display: flex; align-items: center; gap: 9px; }
.article-heading h1 svg { width: 29px; height: 29px; color: #566f89; }
.article-lead { margin: 9px 0 14px; max-width: 900px; }
.article-with-infobox::after { content: ""; display: table; clear: both; }
.infobox {
  float: right;
  clear: right;
  width: 292px;
  margin: 0 0 18px 24px;
  border: 1px solid #a2a9b1;
  background: #f8f9fa;
  font-size: 12px;
}
.infobox-title {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: #dfeaf5;
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  font-weight: 700;
}
.infobox-subtitle { display: block; margin-top: 2px; color: var(--muted); font-family: Arial, sans-serif; font-size: 11px; font-weight: 400; }
.infobox-image {
  height: 132px;
  display: grid;
  place-items: center;
  border-bottom: 1px solid var(--line-soft);
  background: #fff;
  color: #66809a;
}
.infobox-image svg { width: 64px; height: 64px; }
.infobox-image span { display: block; margin-top: 5px; color: var(--muted-2); font-size: 10px; text-align: center; }
.infobox table { border: 0; background: transparent; font-size: 12px; }
.infobox th,
.infobox td { padding: 5px 7px; border: 0; border-bottom: 1px solid #d8dadd; vertical-align: top; }
.infobox th { width: 43%; background: #eef0f2; font-weight: 700; }
.infobox tr:last-child th,
.infobox tr:last-child td { border-bottom: 0; }
.infobox-footer { padding: 7px 8px; border-top: 1px solid var(--line-soft); text-align: center; }
.article-body { min-width: 0; }
.article-body h2 { clear: none; }
.toc {
  display: inline-block;
  min-width: 240px;
  margin: 5px 0 12px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  background: #f8f9fa;
  font-size: 12px;
}
.toc-title { margin-bottom: 5px; text-align: center; font-weight: 700; }
.toc ol { margin: 0; padding-left: 22px; }
.toc li { margin: 2px 0; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  margin: 8px 0 12px;
  border-top: 1px solid var(--line-soft);
  border-left: 1px solid var(--line-soft);
}
.stat-cell { padding: 7px 8px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); background: #fff; }
.stat-cell:nth-child(8n+1), .stat-cell:nth-child(8n+2), .stat-cell:nth-child(8n+3), .stat-cell:nth-child(8n+4) { background: #f8f9fa; }
.stat-cell small { display: block; color: var(--muted-2); font-size: 10px; text-transform: uppercase; letter-spacing: .25px; }
.stat-cell strong { display: block; margin-top: 1px; font-size: 14px; }
.notes-box { padding: 10px 12px; border-left: 3px solid #8daac9; background: #f5f8fb; }
.related-list { display: flex; flex-wrap: wrap; gap: 7px 12px; }
.related-list a { display: inline-flex; align-items: center; gap: 5px; }

/* Quest article */
.quest-steps { counter-reset: step; margin: 0; padding: 0; list-style: none; }
.quest-steps li {
  position: relative;
  margin: 0 0 8px;
  padding: 9px 10px 9px 42px;
  border: 1px solid var(--line-soft);
  background: #fff;
  line-height: 1.5;
}
.quest-steps li::before {
  counter-increment: step;
  content: counter(step);
  position: absolute;
  left: 9px;
  top: 8px;
  width: 23px;
  height: 23px;
  display: grid;
  place-items: center;
  border: 1px solid #8aa4bd;
  background: #edf5fc;
  color: #385d7d;
  font-weight: 700;
}

/* Skill tree */
.skill-tree { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 10px; }
.skill-node {
  position: relative;
  display: block;
  padding: 10px;
  border: 1px solid var(--line);
  background: #f8f9fa;
  color: var(--text);
}
.skill-node:hover { border-color: #72777d; background: #fff; text-decoration: none; }
.skill-node-head { display: flex; gap: 8px; align-items: center; }
.skill-node .arrow { display: block; margin-top: 7px; color: var(--muted-2); font-size: 11px; }

/* Cards and generic category tiles */
.card-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 9px; }
.entity-card {
  display: block;
  padding: 10px;
  border: 1px solid var(--line-soft);
  background: #fff;
  color: var(--text);
}
.entity-card:hover { background: #f8f9fa; text-decoration: none; border-color: var(--line); }
.entity-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.entity-name { color: var(--blue); font-weight: 700; }
.entity-meta { margin-top: 4px; color: var(--muted-2); font-size: 11px; }
.entity-row { display: flex; align-items: flex-start; gap: 9px; }
.entity-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  flex: 0 0 40px;
  border: 1px solid var(--line-soft);
  background: #f8f9fa;
  color: #5e748b;
}
.entity-icon svg { width: 23px; height: 23px; }

/* Tools */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.range-line {
  display: grid;
  grid-template-columns: 48px minmax(0,1fr) 36px;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid #eaecf0;
}
.range-line input { width: 100%; }
.range-line output { text-align: right; font-weight: 700; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 31px;
  padding: 5px 10px;
  border-radius: 2px;
  font-size: 12px;
}
.button.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
.button.primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }

/* Footer */
.site-footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 13px 24px 20px;
  color: var(--muted-2);
  font-size: 11px;
}

/* Responsive */
@media (max-width: 1040px) {
  .wiki-shell { grid-template-columns: 205px minmax(0,1fr); }
  .wiki-sidebar { padding-left: 12px; padding-right: 12px; }
  .main-content { width: calc(100% - 24px); padding: 20px; }

@media (max-width: 760px) {

/* V4 — iRO Wiki Classic inspired information architecture */

/* V6 — filled General Topics + dedicated wiki icons */
.main-topic-list { list-style: none; margin-left: 18px; }
.main-topic-list li { margin-bottom: 6px; }
.main-topic-list li > a { display: inline-flex; align-items: center; gap: 7px; }

.verified-topic-note {
  display: flex;
  gap: 10px;
  margin: 12px 0 18px;
  padding: 9px 12px;
  border: 1px solid #7ca276;
  background: #f1f8ef;
  color: #34502f;
  line-height: 1.45;
}
.verified-topic-note .notice-icon { color: #52774d; }

.wiki-callout {
  margin: 12px 0 17px;
  padding: 10px 12px;
  border: 1px solid #9fb5cb;
  border-left-width: 4px;
  background: #f5f9fd;

}

}

.wiki-link-grid {
  display: grid;

}
.wiki-link-grid > a {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: 3px 8px;
  align-items: center;
  padding: 9px 10px;
  border: 1px solid var(--line-soft);

}
.wiki-link-grid > a:hover { background: #fff; text-decoration: none; border-color: var(--line); }
.wiki-link-grid .mini-icon { grid-row: 1 / 3; width: 18px; height: 18px; }
.wiki-link-grid strong, .wiki-link-grid small { display: block; }
.wiki-link-grid small { margin-top: 2px; color: var(--muted); }

.wiki-feature-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0 18px;
}
.wiki-feature-list > div {
  padding: 10px 12px;
  border: 1px solid var(--line-soft);
  background: #fff;
}
.wiki-feature-list > div > strong { display: flex; align-items: center; gap: 7px; }
.wiki-feature-list p { margin: 6px 0 0; font-size: 13px; }

.guide-class-links {
  margin: 10px 0 14px;
  padding: 9px 12px;
  border: 1px solid var(--line-soft);
  background: var(--paper-soft);
  text-align: center;
  line-height: 1.8;
}
.checklist { counter-reset: wiki-check; padding-left: 0; list-style: none; }
.checklist li {
  position: relative;
  min-height: 31px;
  margin: 8px 0;
  padding: 5px 0 5px 38px;
}
.checklist li::before {
  counter-increment: wiki-check;
  content: counter(wiki-check);
  position: absolute;
  left: 0;
  top: 1px;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid #879eb8;
  border-radius: 50%;
  background: #edf5fd;

  font-weight: 700;

}

.controls-table th:first-child { width: 180px; white-space: nowrap; }
.keycap {
  display: inline-block;
  min-width: 28px;
  margin: 0 2px;
  padding: 2px 6px;
  border: 1px solid #9ca3af;

}

.shortcut-grid > div {

.faq-list .faq-item { margin: 0; padding: 0; }

  margin-top: 25px;

}

  content: "Q. ";

}

.glossary-jump {

}
.glossary-jump a { font-weight: 700; }
.glossary-table th:first-child { width: 160px; white-space: nowrap; }
.glossary-table tbody th { background: #f8f9fa; color: #202122; text-align: left; }
.muted-note { color: var(--muted); font-size: 12px; }

.source-box {
  display: none !important;
  margin: 30px 0 0;
  padding: 10px 12px;
  border-top: 1px solid var(--line-soft);
  background: #fafafa;
  color: var(--muted);
  font-size: 12px;
}
h2#sources { display: none !important; }
.source-box > strong { color: var(--text); }
.source-box ul { margin: 6px 0 0 19px; padding: 0; }
.source-box li { margin: 3px 0; }

/* Interactive world map */
.world-map-shell {
  margin: 14px 0 20px;
  padding: 10px;
  border: 1px solid var(--line);
  background: #111820;
}
.world-map-canvas {
  position: relative;
  width: min(100%, 1000px);
  margin: 0 auto;
}
.world-map-canvas > img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid #56616b;
}
.world-hotspot {
  position: absolute;
  z-index: 4;
  width: 20px;
  height: 20px;
  padding: 0;
  transform: translate(-50%, -50%);
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 1px 5px rgba(0,0,0,.65);
  cursor: help;
}
.world-hotspot.city { background: #3366cc; }
.world-hotspot.dungeon { background: #c62828; }
.world-hotspot::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 50%;
}
.world-hotspot:hover,
.world-hotspot:focus {
  z-index: 30;
  transform: translate(-50%, -50%) scale(1.18);
  outline: none;
}
.world-tooltip {
  display: none;
  position: absolute;
  left: 50%;
  bottom: calc(100% + 9px);
  width: 250px;
  max-width: 70vw;
  padding: 9px 10px;
  transform: translateX(-50%) scale(.86);
  border: 1px solid #72777d;
  background: #fff;
  color: var(--text);
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
  text-align: left;
  font-size: 12px;
  line-height: 1.4;
  pointer-events: none;
}
.world-hotspot:hover .world-tooltip,
.world-hotspot:focus .world-tooltip { display: block; }
.world-tooltip strong { display: block; margin-bottom: 3px; color: var(--blue-dark); }
.world-tooltip small { display: block; color: var(--muted); margin-top: 4px; }
.world-map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 12px;
  margin: 8px 0 0;
  color: #d6dde5;
  font-size: 11px;
}
.world-map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.world-map-legend i {
  width: 10px; height: 10px; display: inline-block;
  border: 1px solid #fff; border-radius: 50%;
}
.world-map-legend i.city { background: #3366cc; }
.world-map-legend i.dungeon { background: #c62828; }
.world-region-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
  margin: 10px 0 18px;
}
.world-region-card {
  padding: 8px 10px;
  border: 1px solid var(--line-soft);
  background: var(--paper-soft);
}
.world-region-card strong { display: block; }
.world-region-card small { display: block; margin-top: 3px; color: var(--muted); }

@media (max-width: 760px) {
  .world-region-grid { grid-template-columns: 1fr; }
  .world-hotspot { width: 18px; height: 18px; }
  .world-tooltip { width: 210px; }
}

@media (max-width: 760px) {
  .wiki-link-grid, .wiki-feature-list { grid-template-columns: 1fr; }
  .shortcut-grid { grid-template-columns: 1fr; }
  .controls-table th:first-child { width: auto; white-space: normal; }
  .glossary-table th:first-child { width: auto; }
}

/* V7 — Direct wiki editing */
.header-actions {
  width: min(980px, 74%);
  flex-wrap: wrap;
  justify-content: flex-end;
}
.lang-toggle {
  min-width: 112px;
  white-space: nowrap;
}
.lang-toggle:disabled { opacity: .55; cursor: not-allowed; }
.edit-toggle,
.edit-actions button,
.editor-small-button {
  height: 35px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: #f8f9fa;
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}
.edit-toggle { padding: 0 12px; }
.edit-toggle:hover,
.edit-actions button:hover,
.editor-small-button:hover { background: #fff; border-color: #72777d; }
.edit-toggle.active {
  background: #fff5d6;
  border-color: #b58a2f;
  color: #5e450f;
}
.edit-actions { display: flex; gap: 5px; }
.edit-actions button { padding: 0 10px; }
.edit-save { background: #eaf6ec !important; border-color: #6e9d74 !important; }
.edit-reset { color: #8a1c1c !important; }
.editor-backup-menu { display: flex; gap: 5px; }
.editor-small-button { padding: 0 9px; font-size: 12px; }

.wiki-edit-mode .rz-content-editable {
  outline: 2px dashed #d39a22;
  outline-offset: 3px;
  background: #fffbe8;
  cursor: text;
  min-height: 1.2em;
}
.wiki-edit-mode .rz-content-editable:focus {
  outline-style: solid;
  background: #fffef7;
  box-shadow: 0 0 0 3px rgba(211,154,34,.12);
}
.wiki-edit-mode a { cursor: text; }

.editable-image-slot {
  position: relative;
  min-height: 112px;
  overflow: hidden;
}
.editable-image-slot .custom-sprite {
  display: block;
  max-width: 100%;
  max-height: 190px;
  margin: 0 auto;
  object-fit: contain;
  image-rendering: auto;
}
.editable-image-slot.image-editable-active {
  cursor: pointer;
  outline: 2px dashed #d39a22;
  outline-offset: -4px;
}
.editable-image-slot.image-editable-active:hover { background: #fffbe8; }
.image-edit-hint {
  display: none;
  position: absolute;
  left: 6px;
  right: 6px;
  bottom: 6px;
  padding: 4px 6px;
  border: 1px solid #b58a2f;
  background: rgba(255,250,223,.96);
  color: #5e450f;
  font-size: 10px !important;
  text-align: center;
  pointer-events: none;
}
.image-editable-active .image-edit-hint { display: block; }
.image-remove-button {
  display: none;
  position: absolute;
  z-index: 3;
  top: 5px;
  right: 5px;
  width: 25px;
  height: 25px;
  padding: 0;
  border: 1px solid #a45b5b;
  border-radius: 50%;
  background: #fff;
  color: #8a1c1c;
  cursor: pointer;
  font-size: 18px;
  line-height: 21px;
}
.image-editable-active .image-remove-button { display: block; }

.editor-toast {
  position: fixed;
  z-index: 9999;
  right: 22px;
  bottom: 22px;
  max-width: 360px;
  padding: 11px 14px;
  border: 1px solid #72777d;
  border-radius: 3px;
  background: #202122;
  color: #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,.22);
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: .18s ease;
  font-size: 13px;
}
.editor-toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 1180px) {
  .header-actions { width: min(820px, 72%); }
  .editor-backup-menu { display: none; }
}

@media (max-width: 760px) {
  .header-actions { width: 100%; flex-wrap: wrap; }
  .global-search-wrap { flex-basis: 100%; }
  .lang-toggle, .edit-toggle { flex: 1; }
  .edit-actions { flex-basis: 100%; }
  .edit-actions button { flex: 1; }
}

.language-choice {
  display: inline-flex;
  height: 35px;
  border: 1px solid var(--line);
  border-radius: 2px;
  overflow: hidden;
  background: #f8f9fa;
}
.language-choice button {
  min-width: 92px;
  padding: 0 10px;
  border: 0;
  border-right: 1px solid var(--line-soft);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}
.language-choice button:last-child { border-right: 0; }
.language-choice button:hover { background: #fff; color: var(--text); }
.language-choice button.active {
  background: #eaf3ff;
  color: var(--blue-dark);
  box-shadow: inset 0 -2px 0 var(--blue);
}
.language-choice button:disabled { opacity: .55; cursor: not-allowed; }

@media (max-width: 760px) {
  .language-choice { flex: 1 1 100%; }
  .language-choice button { flex: 1; min-width: 0; }
}

/* ========================================================================== */
/* V8 — ergonomic Ragnarok wiki refresh                                       */
/* ========================================================================== */
:root {
  --wiki-bg: #eeedf7;
  --paper: #fffefc;
  --paper-soft: #faf9fd;
  --sidebar: #f7f6fb;
  --text: #24242b;
  --muted: #62626d;
  --muted-2: #7e7e89;
  --line: #aaa9b5;
  --line-soft: #d5d3df;
  --blue: #315fb6;
  --blue-dark: #234989;
  --blue-pale: #edf3ff;
  --accent: #f2a45b;
  --accent-dark: #c96f27;
  --accent-soft: #fff0df;
  --lavender: #f1f0fb;
  --shadow: 0 8px 30px rgba(54, 48, 84, .08);
}

body {
  background:
    radial-gradient(circle at 85% 8%, rgba(255,255,255,.82), transparent 25rem),
    linear-gradient(180deg, #f2f1f9 0, #ecebf5 100%);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
  font-size: 14px;
}

.wiki-shell { grid-template-columns: 258px minmax(0, 1fr); }
.wiki-sidebar {
  z-index: 80;
  padding: 18px 14px 30px;
  background: rgba(249,248,252,.96);
  border-right: 1px solid #d4d2dd;
  box-shadow: 5px 0 22px rgba(50,44,78,.035);
  scrollbar-width: thin;
}
.brand {
  margin: 0 4px 20px;
  padding: 7px 6px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.brand-emblem {
  width: 50px;
  height: 50px;
  flex-basis: 50px;
  border-color: #c8854b;
  color: #9e551d;
  background: linear-gradient(145deg,#fffaf1,#ffe4c8);
  box-shadow: inset 0 0 0 3px #fff5e8, 0 2px 8px rgba(109,64,29,.12);
}
.brand-emblem::before,.brand-emblem::after { border-color: #c8854b; }
.brand-copy strong { font-size: 15px; font-weight: 600; }
.brand-wiki { color: #33313d; font-size: 23px; }
.brand-copy small { color: #87828f; }

.nav-group { margin: 0 0 9px; }
.nav-group-title {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 29px;
  margin: 0;
  padding: 5px 8px;
  border: 0;
  border-bottom: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: #686472;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .32px;
  text-align: left;
  text-transform: uppercase;
}

.edit-toggle,.edit-actions button,.editor-small-button {

}
.edit-toggle { background: #fffaf3; border-color: #d9b28d; color: #75461f; }
.edit-actions { align-items: center; }
.link-languages {

/* Class progression tree — inspired by classic Ragnarok class charts */
.class-tree {
  position: relative;
  margin: 14px 0 24px;
  padding: 0 0 14px;
  overflow: hidden;
  border: 1px solid #c9c6d4;
  border-radius: 9px;
  background: #eeeffc;
  box-shadow: inset 0 0 34px rgba(84,76,133,.035);
}
.class-tree-tier-title {
  height: 27px;
  display: grid;
  place-items: center;
  margin: 0;
  border-bottom: 1px solid #d8995f;
  background: linear-gradient(180deg,#ffc77f,#f4aa60);
  color: #412817;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .35px;
  text-transform: uppercase;
}
.class-tree-start {
  position: relative;
  display: flex;
  justify-content: center;
  padding: 24px 15px 21px;
}
.class-tree-connector {
  position: relative;
  width: min(84%, 1040px);
  height: 29px;
  margin: -6px auto 0;
}
.class-tree-connector::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  height: 16px;
  border-left: 2px solid #b1adc2;
}
.class-tree-connector::after {
  content: "";
  position: absolute;
  left: 8.33%;
  right: 8.33%;
  top: 15px;
  border-top: 2px solid #b1adc2;
}
.class-tree-first-row {
  display: grid;
  grid-template-columns: repeat(6, minmax(125px, 1fr));
  gap: 5px;
  padding: 22px 14px 14px;
}
.class-tree-node {
  position: relative;
  min-width: 0;
  padding: 8px 5px 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  text-align: center;
  transition: background .14s ease, border-color .14s ease, transform .14s ease;
}
.class-tree-first-row .class-tree-node::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -23px;
  height: 22px;
  border-left: 2px solid #b1adc2;
}
.class-tree-node:hover {
  border-color: rgba(142,133,171,.28);
  background: rgba(255,255,255,.52);
  transform: translateY(-1px);
}
.class-tree-name {
  display: inline-block;
  margin-bottom: 5px;
  color: #273e74;
  font-size: 13px;
  font-weight: 800;
}
.class-tree-sprites {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  min-height: 105px;
}
.class-sprite-slot {
  width: 66px;
  min-height: 96px;
  display: grid;
  place-items: end center;
  overflow: visible;
  border: 0;
  background: transparent;
}
.class-sprite-slot .custom-sprite {
  max-width: 64px;
  max-height: 96px;
  image-rendering: pixelated;
  filter: drop-shadow(0 2px 1px rgba(47,40,62,.16));
}
.class-sprite-placeholder {
  width: 52px;
  height: 82px;
  display: grid;
  place-content: center;
  align-self: end;
  border: 1px dashed #aaa5ba;
  border-radius: 7px;
  background: rgba(255,255,255,.38);
  color: #858096;
}
.class-sprite-placeholder svg { width: 27px; height: 27px; margin: 0 auto; }
.class-sprite-placeholder span { margin-top: 5px; font-size: 9px; }
.class-tree-caption {
  margin: 8px 14px 0;
  padding: 8px 10px;
  border-top: 1px solid rgba(169,165,184,.5);
  color: #696578;
  font-size: 11px;
  text-align: center;
}
.class-tree.compact .class-tree-first-row { grid-template-columns: repeat(6,minmax(95px,1fr)); padding-left: 8px; padding-right: 8px; }
.class-tree.compact .class-tree-sprites { min-height: 78px; }
.class-tree.compact .class-sprite-slot { width: 48px; min-height: 72px; }
.class-tree.compact .class-sprite-slot .custom-sprite { max-width: 46px; max-height: 70px; }
.class-tree.compact .class-sprite-placeholder { width: 41px; height: 63px; }
.class-tree.compact .class-sprite-placeholder svg { width: 21px; height: 21px; }
.class-tree.compact .class-tree-name { font-size: 11.5px; }
.class-tree.compact .class-tree-caption { display: none; }
.class-tree .image-remove-button { top: 0; right: -1px; width: 20px; height: 20px; font-size: 14px; line-height: 16px; }
.class-tree .image-edit-hint { left: -4px; right: -4px; bottom: -3px; font-size: 8px !important; }

.class-directory {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 9px;
}
.class-directory-card {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  align-items: center;
  gap: 9px;
  min-height: 60px;
  padding: 9px 12px;
  border: 1px solid #d0cdd7;
  border-radius: 8px;
  background: #faf9fc;
  color: #2d4e89;
}
.class-directory-card:hover { border-color: #bca990; background: #fffaf4; text-decoration: none; }
.class-directory-card > .icon { width: 25px; height: 25px; color: #9a6741; }
.class-directory-card small { display: block; margin-top: 2px; color: #77717d; }
.class-directory-arrow { color: #aaa2ad; font-size: 18px; }

/* Editor clarity */
.wiki-edit-mode .rz-content-editable {
  outline-color: #dd8e36;
  border-radius: 3px;
  background: #fff8df;
}
.wiki-edit-mode .editable-image-slot.image-editable-active { outline-color: #dd8e36; border-radius: 5px; }
.wiki-edit-mode::before {
  content: "Edit mode — FR ↔ EN linking can be toggled in the top bar";
  position: fixed;
  z-index: 120;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  padding: 7px 11px;
  border: 1px solid #c4934d;
  border-radius: 999px;
  background: rgba(255,248,226,.96);
  color: #63471e;
  box-shadow: 0 4px 14px rgba(68,48,20,.12);

@media (max-width: 1240px) {
  .wiki-shell { grid-template-columns: 235px minmax(0,1fr); }
  .header-actions { width: 78%; }
  .class-tree-first-row { grid-template-columns: repeat(3,minmax(150px,1fr)); }
  .class-tree-connector { display: none; }
  .class-tree-first-row .class-tree-node::before { display: none; }
  .class-directory { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

@media (max-width: 820px) {
  .wiki-shell { display: block; }
  .wiki-sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(310px, 88vw);
    height: 100vh;
    transform: translateX(-105%);
    transition: transform .18s ease;
    border-right: 1px solid #cbc8d4;
    box-shadow: 12px 0 40px rgba(30,26,43,.24);
  }
  body.sidebar-open .wiki-sidebar { transform: translateX(0); }
  body.sidebar-open::after {
    content: "";
    position: fixed;
    z-index: 75;
    inset: 0;
    background: rgba(31,28,42,.34);
  }
  .mobile-menu-toggle {
    position: relative;
    z-index: 2;
    display: inline-grid;
    place-items: center;
    width: 39px;
    height: 39px;
    flex: 0 0 39px;
    border: 1px solid #c4c1cc;
    border-radius: 8px;
    background: #fff;
    color: #4d4855;
    cursor: pointer;
    font-size: 18px;
  }
  .site-header { gap: 8px; padding: 8px 10px; }
  .header-actions { width: 100%; flex-wrap: wrap; }
  .global-search-wrap { order: -1; flex-basis: calc(100% - 48px); }
  .language-choice { flex: 1; }
  .edit-toggle { flex: 1; }
  .editor-backup-menu { display: none; }
  .main-content { width: 100%; margin: 0; padding: 20px 14px 35px; border: 0; border-radius: 0; box-shadow: none; }
  .class-tree-first-row { grid-template-columns: repeat(2,minmax(135px,1fr)); }
  .class-directory { grid-template-columns: 1fr; }
  .classic-main-columns { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  .article-heading h1 { font-size: 26px; }
  .class-tree-first-row { grid-template-columns: 1fr 1fr; padding-left: 5px; padding-right: 5px; }
  .class-tree-node { padding-left: 1px; padding-right: 1px; }
  .class-tree-sprites { min-height: 86px; }
  .class-sprite-slot { width: 52px; min-height: 80px; }
  .class-sprite-slot .custom-sprite { max-width: 50px; max-height: 78px; }
  .class-sprite-placeholder { width: 43px; height: 67px; }
  .edit-actions { width: 100%; flex-wrap: wrap; }
  .link-languages { flex-basis: 100%; }
}
.class-infobox-sprites {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  padding: 10px 6px 8px;
  border-bottom: 1px solid var(--line-soft);
  background: linear-gradient(180deg,#fff,#f8f7fc);
}
.class-infobox-sprites > div { text-align: center; }
.class-infobox-sprites > div > small { display: block; margin-bottom: 2px; color: #77717e; font-weight: 700; }
.class-infobox-sprites .class-sprite-slot { width: 100%; min-height: 110px; }
.class-infobox-sprites .class-sprite-slot .custom-sprite { max-width: 90px; max-height: 110px; }
.class-infobox-sprites .class-sprite-placeholder { width: 65px; height: 94px; }

/* V10 — clickable class tree, upcoming second jobs, visual database directory */
.class-tree {
  overflow-x: auto;
  overflow-y: hidden;
}
.class-tree-node-link {
  display: block;
  min-width: 0;
  color: inherit;
  text-decoration: none !important;
  border-radius: 8px;
}
.class-tree-node-link:hover .class-tree-node,
.class-tree-node-link:focus-visible .class-tree-node {
  border-color: rgba(142,133,171,.42);
  background: rgba(255,255,255,.72);
  box-shadow: 0 4px 11px rgba(59,49,90,.08);
  transform: translateY(-2px);
}
.class-tree-node-link:focus-visible { outline: 2px solid #4f6bb0; outline-offset: 2px; }
.class-tree-node { cursor: pointer; }
.class-tree-node .class-tree-name {
  display: block;
  margin: 5px 0 0;
  color: #273e74;
  text-decoration: none;
}
.class-tree-node.second { padding: 6px 3px 8px; }
.class-tree-node.second .class-tree-name { font-size: 11px; }
.class-tree-sprites.single { min-height: 93px; }
.class-preview-slot {
  position: relative;
  width: 76px;
  min-height: 96px;
  display: grid;
  place-items: end center;
  margin: 0 auto;
  overflow: visible;
}
.class-preview-slot .custom-sprite {
  max-width: 72px;
  max-height: 98px;
  object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(0 2px 1px rgba(47,40,62,.16));
}
.class-preview-slot.compact { width: 56px; min-height: 77px; }
.class-preview-slot.compact .custom-sprite { max-width: 54px; max-height: 74px; }
.class-preview-slot .class-sprite-placeholder { align-self: end; }
.class-status-badge {
  display: inline-block;
  margin-top: 4px;
  padding: 1px 5px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 800;
  line-height: 1.5;
  text-transform: uppercase;
  letter-spacing: .25px;
}
.class-status-badge.coming { color: #79501d; background: #fff0c6; border: 1px solid #e8c978; }
.class-status-badge.live { color: #356136; background: #e7f4e4; border: 1px solid #aad0a8; }
.class-tree-tier-title.second-tier { margin-top: 3px; }
.class-tree-second-grid {
  display: grid;
  grid-template-columns: repeat(6,minmax(125px,1fr));
  gap: 6px;
  padding: 19px 14px 17px;
  background: rgba(255,255,255,.13);
}
.class-tree-branch {
  position: relative;
  min-width: 0;
  padding-top: 12px;
}
.class-tree-branch::before {
  content: "";
  position: absolute;
  top: -19px;
  left: 50%;
  height: 24px;
  border-left: 2px solid #b1adc2;
}
.class-tree-branch-children {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 3px;
  position: relative;
}
.class-tree-branch-children::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 24%;
  right: 24%;
  border-top: 2px solid #b1adc2;
}
.class-tree-branch-children .class-tree-node-link { position: relative; }
.class-tree-branch-children .class-tree-node-link::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 50%;
  height: 8px;
  border-left: 2px solid #b1adc2;
  z-index: 0;
}
.class-tree-branch[data-parent="archer"] .class-tree-branch-children {
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 1px;
}
.class-tree-branch[data-parent="archer"] .class-tree-branch-children::before { left: 16%; right: 16%; }
.class-tree-branch[data-parent="archer"] .class-preview-slot.compact { width: 43px; }
.class-tree-branch[data-parent="archer"] .class-preview-slot.compact .custom-sprite { max-width: 42px; }
.class-tree.compact .class-tree-second-grid { grid-template-columns: repeat(6,minmax(95px,1fr)); padding-left: 8px; padding-right: 8px; }
.class-tree.compact .class-tree-branch-children { gap: 1px; }
.class-tree.compact .class-tree-node.second .class-tree-name { font-size: 9px; }
.class-tree.compact .class-status-badge { display: none; }
.class-tree.compact .class-preview-slot.compact { width: 42px; min-height: 61px; }
.class-tree.compact .class-preview-slot.compact .custom-sprite { max-width: 40px; max-height: 60px; }
.class-infobox-sprites.single { grid-template-columns: 1fr; justify-items: center; }
.class-infobox-sprites.single > div { max-width: 130px; }
.class-directory.upcoming { grid-template-columns: repeat(3,minmax(0,1fr)); }
.class-directory-sprite {
  width: 38px;
  height: 48px;
  object-fit: contain;
  image-rendering: pixelated;
  flex: 0 0 auto;
}

/* Database categories: vertical and image-led like a compact wiki directory. */
.database-category-list {
  display: flex;
  flex-direction: column;
  gap: 0;
  border: 1px solid #c8c5d0;
  border-radius: 7px;
  overflow: hidden;
  background: #fff;
}
.database-category-row {
  display: grid;
  grid-template-columns: 62px minmax(0,1fr) 30px;
  align-items: center;
  min-height: 72px;
  padding: 7px 10px 7px 6px;
  border-bottom: 1px solid #ddd9e5;
  color: #243e79;
  text-decoration: none !important;
  transition: background .12s ease, transform .12s ease;
}
.database-category-row:last-child { border-bottom: 0; }
.database-category-row:nth-child(even) { background: #fafafe; }
.database-category-row:hover,
.database-category-row:focus-visible { background: #f0f2ff; }
.database-category-row:focus-visible { outline: 2px solid #526db0; outline-offset: -2px; }
.database-category-sprite {
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
}
.database-category-sprite img {
  max-width: 54px;
  max-height: 54px;
  object-fit: contain;
  image-rendering: pixelated;
}
.database-category-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

  function decorateSectionStatusPills() {
    const route = (location.hash || '#/').split('?')[0].replace(/\/section\/[^/]+$/, '');
    if (route === '#/' || route === '#/wiki/sources-links') return;
    const routeMap = SECTION_STATUS_BY_ROUTE[route] || {};
    const fullyVerifiedRoutes = new Set([
      '#/wiki/introduction',
      '#/wiki/getting-started',
      '#/wiki/basic-controls',
      '#/wiki/useful-info',
      '#/wiki/glossary'
    ]);
    const housekeepingIds = new Set(['sources','related','see-also','skill-see-also']);
    const housekeepingLabels = new Set([
      'sources','related pages','pages associées','see also','voir aussi',
      'official sources','sources officielles'
    ]);

    app.querySelectorAll('h2').forEach(h => {
      if (h.querySelector('.section-status-pill')) return;
      if (h.closest('.faq-item, .portal-box, .panel')) return;

      const id = h.id || '';
      const rawLabel = h.textContent.trim().toLowerCase();
      if (housekeepingIds.has(id) || housekeepingLabels.has(rawLabel)) return;

      let status = routeMap[id] || (fullyVerifiedRoutes.has(route) ? 'complete' : 'partial');

      if (
        rawLabel.includes('ragnarok data status') ||
        rawLabel.includes('état des données ragnarok')
      ) status = 'missing';

      let node = h.nextElementSibling;
      let sawEmpty = false;
      let sawUseful = false;
      while (node && node.tagName !== 'H2') {
        if (node.classList?.contains('empty')) sawEmpty = true;
        const txt = (node.textContent || '').trim();
        if (txt.length > 80 && !node.classList?.contains('empty')) sawUseful = true;
        node = node.nextElementSibling;
      }
      if (sawEmpty && !sawUseful) status = 'missing';

      h.insertAdjacentHTML('beforeend', sectionStatusPill(status));
    });
  }

  function wireNaviCopy() {
    app.querySelectorAll('code').forEach(code => {
      const command = (code.textContent || '').trim();
      if (!/^\/navi\s+/i.test(command) || code.closest('.navi-copy')) return;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'navi-copy';
      button.setAttribute('aria-label', navLabel('Copy navigation command','Copier la commande de navigation'));
      const commandCode = document.createElement('code');
      commandCode.textContent = command;
      const hint = document.createElement('span');
      hint.className = 'navi-copy-hint';
      hint.textContent = navLabel('Copy','Copier');
      button.append(commandCode, hint);
      code.replaceWith(button);
    });

    app.querySelectorAll('.navi-copy').forEach(button => {
      button.addEventListener('click', async () => {
        const command = button.querySelector('code')?.textContent?.trim() || '';
        let copied = false;
        try {
          await navigator.clipboard.writeText(command);
          copied = true;
        } catch (_) {
          const area = document.createElement('textarea');
          area.value = command;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          copied = document.execCommand('copy');
          area.remove();
        }
        if (copied) {
          button.classList.add('copied');
          const hint = button.querySelector('.navi-copy-hint');
          if (hint) hint.textContent = navLabel('Copied!','Copié !');
          setTimeout(() => {
            button.classList.remove('copied');
            if (hint) hint.textContent = navLabel('Copy','Copier');
          }, 1300);
        }
      });
    });
  }

  function classSpriteDefault(classId, gender) {
    if (!['male','female'].includes(gender)) return '';
    const dualGender = new Set([
      'novice','swordman','mage','archer','merchant','thief','acolyte',
      'knight','crusader','wizard','sage','hunter','blacksmith','alchemist',
      'assassin','rogue','priest','monk'
    ]);
    if (dualGender.has(classId)) return asset(`assets/classes/${classId}-${gender}.png`);
    if (classId === 'bard' && gender === 'male') return asset('assets/classes/bard-male.png');
    if (classId === 'dancer' && gender === 'female') return asset('assets/classes/dancer-female.png');
    return '';
  }

  function classGenderList(classId) {
    if (classId === 'bard') return ['male'];
    if (classId === 'dancer') return ['female'];

  }

    const c = getClass(classId);

  function glossaryPage(topic) {
    const rows = [
      ['AGI', navLabel('Agility. A base stat that affects attack speed, Dodge and physical defense.','Agility. Stat de base qui affecte la vitesse d’attaque, l’esquive et la défense physique.')],
      ['ASPD', navLabel('Attack Speed.','Attack Speed : vitesse d’attaque.')],
      ['ATK', navLabel('Physical Attack. The status window separates status ATK and equipment ATK.','Attaque physique. La fenêtre de statut sépare l’ATK de statut et l’ATK d’équipement.')],
      ['Auto-Hunt', navLabel('The official automated hunting feature built into Ragnarok.','La fonction officielle de chasse automatisée intégrée à Ragnarok.')],
      ['Base Level', navLabel('The character’s general progression level, separate from Job Level.','Le niveau général de progression du personnage, distinct du Job Level.')],
      ['Card', navLabel('A monster-associated item that can provide an effect when compounded into compatible socketed equipment.','Un objet associé à un monstre pouvant fournir un effet lorsqu’il est inséré dans un équipement compatible avec slot.')],
      ['DEF', navLabel('Physical Defense. The status guide distinguishes status DEF and equipment DEF.','Défense physique. Le guide de statut distingue la DEF de statut et la DEF d’équipement.')],
      ['DEX', navLabel('Dexterity. A base stat related to physical attack, Hit, casting and ranged weapon damage.','Dexterity. Stat de base liée à l’attaque physique, au Hit, au cast et aux dégâts des armes à distance.')],
      ['FLEE', navLabel('Evasion rate; the Global status guide displays normal evasion and Perfect Dodge separately.','Taux d’esquive ; le guide Global affiche séparément l’esquive normale et le Perfect Dodge.')],
      ['Get Poring', navLabel('A companion side-game connected to Ragnarok in which players raise and evolve Porings.','Un jeu compagnon lié à Ragnarok dans lequel les joueurs élèvent et font évoluer des Porings.')],
      ['Guild', navLabel('A persistent player community with members, emblem, management and guild systems.','Une communauté persistante de joueurs avec membres, emblème, gestion et systèmes de guilde.')],
      ['HIT', navLabel('Accuracy / hit rate used for physical attacks.','Précision / taux de réussite utilisé pour les attaques physiques.')],
      ['HP', navLabel('Health Points: current and maximum character health.','Health Points : points de vie actuels et maximum du personnage.')],
      ['INT', navLabel('Intelligence. A base stat related to magic attack, casting and magic defense.','Intelligence. Stat de base liée à l’attaque magique, au cast et à la défense magique.')],
      ['Job Level', navLabel('Class progression level used alongside Base Level.','Niveau de progression de la classe utilisé en parallèle du Base Level.')],
      ['LUK', navLabel('Luck. A base stat that influences several values including critical chance and Perfect Dodge.','Luck. Stat de base influençant plusieurs valeurs, notamment les chances de critique et le Perfect Dodge.')],
      ['MATK', navLabel('Magic Attack.','Magic Attack : attaque magique.')],
      ['MDEF', navLabel('Magic Defense.','Magic Defense : défense magique.')],
      ['MVP', navLabel('A major boss-type monster. MVP Raid is also the name of a dedicated Global group activity.','Un monstre majeur de type boss. MVP Raid est aussi le nom d’une activité de groupe dédiée du service Global.')],
      ['NPC', navLabel('Non-Player Character: an in-game character used for quests, shops, services and other interactions.','Non-Player Character : personnage non joueur utilisé pour les quêtes, boutiques, services et autres interactions.')],
      ['Party', navLabel('A temporary group of players that can hunt together and use shared EXP/item distribution settings.','Un groupe temporaire de joueurs pouvant chasser ensemble et utiliser des réglages de distribution d’EXP et d’objets.')],
      ['Refinement', navLabel('Equipment upgrade system that increases a weapon or armor refinement level when successful.','Système d’amélioration d’équipement qui augmente le niveau de refine d’une arme ou armure en cas de réussite.')],
      ['RO Factory', navLabel('A Global creation feature used for custom footprint effects and other shareable cosmetic creations.','Une fonctionnalité de création Global servant notamment aux effets personnalisés de traces de pas et autres créations cosmétiques partageables.')],
      ['Socket / Slot', navLabel('An equipment slot that can accept a compatible card.','Un emplacement d’équipement pouvant recevoir une carte compatible.')],
      ['SP', navLabel('Skill Points resource shown as current and maximum SP and consumed by many skills.','Ressource affichée en SP actuels et maximum, consommée par de nombreuses compétences.')],
      ['STR', navLabel('Strength. A base stat related to melee physical attack and weight limit.','Strength. Stat de base liée à l’attaque physique de mêlée et à la limite de poids.')],
      ['VIT', navLabel('Vitality. A base stat related to maximum HP and defenses.','Vitality. Stat de base liée aux HP maximum et aux défenses.')],
      ['Zeny', navLabel('The standard in-game currency used for many NPC services and purchases.','La monnaie standard du jeu utilisée pour de nombreux services NPC et achats.')]
    ].sort((a,b)=>a[0].localeCompare(b[0]));
    return `${generalPageHeader(topic)}
      <p class="article-lead">${navLabel(
        'A quick reference for common Ragnarok terms. In-game names and abbreviations stay in English even when the explanation is displayed in French.',
        'Une référence rapide des termes courants de Ragnarok. Les noms et abréviations du jeu restent en anglais même lorsque l’explication est affichée en français.'
      )}</p>
      <div class="glossary-jump">${[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(l=>`<a href="#letter-${l}">${l}</a>`).join(' ')}</div>
      <div class="table-wrap"><table class="glossary-table"><thead><tr><th>${navLabel('Term','Terme')}</th><th>${navLabel('Meaning','Signification')}</th></tr></thead><tbody>
        ${rows.map(([term,meaning],i)=>{const letter=term[0].toUpperCase(); const prev=i?rows[i-1][0][0].toUpperCase():''; return `<tr${letter!==prev?` id="letter-${letter}"`:''}><th>${esc(term)}</th><td>${meaning}</td></tr>`}).join('')}
      </tbody></table></div>
      <p class="muted-note">${navLabel('This glossary will grow as the wiki documents more systems.','Ce glossaire s’agrandira à mesure que le wiki documentera davantage de systèmes.')}</p>
      ${officialSources([
        ['Official Status guide','https://roz.mygnjoy.com/en/intro/guide/2'],
        ['Official Cards guide','https://roz.mygnjoy.com/en/intro/guide/7'],
        ['Official Party guide','https://roz.mygnjoy.com/en/intro/guide/17'],
        ['Official Guild guide','https://roz.mygnjoy.com/en/intro/guide/18'],
        ['Official Refinement guide','https://roz.mygnjoy.com/en/intro/guide/20']
      ])}`;
  }

  function elementClassName(name) {
    return 'el-' + name.toLowerCase();
  }

  function elementChip(name, row=false) {
    return `<span class="${row?'element-row-chip':'element-head-chip'}"><i class="element-dot ${elementClassName(name)}"></i><span>${esc(name)}</span></span>`;
  }

  function elementModifierClass(value) {
    if (value === 0) return 'element-mod-immune';
    if (value <= 75) return 'element-mod-low';
    if (value < 100) return 'element-mod-midlow';
    if (value === 100) return 'element-mod-normal';
    if (value <= 125) return 'element-mod-good';
    if (value <= 150) return 'element-mod-high';
    return 'element-mod-veryhigh';
  }

  function renderElementMatrix(level) {
    const source = ELEMENT_TABLES_IRO[level];
    // source[defenderIndex][attackerIndex] -> displayed row attacker, column defender
    const body = ELEMENT_NAMES.map((attacker, attackerIndex) => {
      const cells = ELEMENT_NAMES.map((defender, defenderIndex) => {
        const value = source[defenderIndex][attackerIndex];
        const title = `${attacker} → ${defender} Lv.${level}: ${value}%`;
        return `<td class="element-mod ${elementModifierClass(value)}" title="${esc(title)}">${value}%</td>`;
      }).join('');
      return `<tr><th scope="row">${elementChip(attacker,true)}</th>${cells}</tr>`;
    }).join('');

    return `<div class="element-matrix-panel" data-element-level="${level}" ${level===1?'':'hidden'}>
      <div class="element-table-wrap">
        <table class="element-matrix">
          <thead><tr>
            <th class="corner"><div class="element-corner-inner"><span class="atk">${navLabel('ATTACKING ↓','ATTAQUE ↓')}</span><span class="def">${navLabel('DEFENDING →','DÉFENSE →')}</span></div></th>
            ${ELEMENT_NAMES.map(name=>`<th scope="col">${elementChip(name)}</th>`).join('')}
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
  }

  function wireElementPage() {
    const tabs=[...document.querySelectorAll('.element-level-tab')];
    const panels=[...document.querySelectorAll('.element-matrix-panel')];
    if(!tabs.length||!panels.length) return;
    tabs.forEach(tab=>tab.addEventListener('click',()=>{
      const level=tab.dataset.elementLevel;
      tabs.forEach(x=>x.classList.toggle('active',x===tab));
      tabs.forEach(x=>x.setAttribute('aria-selected',x===tab?'true':'false'));
      panels.forEach(panel=>panel.hidden=panel.dataset.elementLevel!==level);
    }));
  }

  function wireAffixDatabase() {
    const sourceSelect=document.getElementById('affix-source');
    const typeSelect=document.getElementById('affix-type');
    const search=document.getElementById('affix-search');
    const output=document.getElementById('affix-output');
    const summary=document.getElementById('affix-summary');
    if(!sourceSelect||!typeSelect||!search||!output||!summary)return;

    sourceSelect.innerHTML=AFFIX_SOURCE_META.map(([id,en,fr])=>`<option value="${id}">${esc(navLabel(en,fr))}</option>`).join('');

    const sourceLabel=id=>{
      const row=AFFIX_SOURCE_META.find(x=>x[0]===id);
      return row?navLabel(row[1],row[2]):id;
    };
    const slotNumber=slot=>Number(String(slot).replace(/\D/g,''))||0;

    const populateTypes=()=>{
      const rows=AFFIX_DATABASE_DATA[sourceSelect.value]||[];
      const types=[...new Set(rows.map(r=>r[0]))].sort((a,b)=>a.localeCompare(b));
      const previous=typeSelect.value;
      typeSelect.innerHTML=types.map(type=>`<option value="${esc(type)}">${esc(type)}</option>`).join('');
      if(types.includes(previous)) typeSelect.value=previous;
    };

    const refresh=()=>{
      const source=sourceSelect.value;
      const type=typeSelect.value;
      const q=search.value.trim().toLowerCase();
      const allForType=(AFFIX_DATABASE_DATA[source]||[]).filter(r=>r[0]===type);
      let rows=allForType;
      if(q) rows=rows.filter(r=>r[2].toLowerCase().includes(q));

      const slot4Options = ['Water','Earth','Fire','Wind','Poison','Holy','Shadow','Ghost','Undead','Unbreakable'];
      const supportsSlot4 = type === 'Armor' || /Series|Weapons/i.test(type);
      const slot4Matches = supportsSlot4
        ? slot4Options.filter(option=>!q || option.toLowerCase().includes(q))
        : [];

      const tiers=[...new Set(rows.map(r=>r[1]))];
      if(slot4Matches.length && !tiers.some(tier=>slotNumber(tier)===4)) tiers.push('Slot 4');
      tiers.sort((a,b)=>slotNumber(a)-slotNumber(b));

      const displayedCount = rows.length + slot4Matches.length;
      const totalCount = allForType.length + (supportsSlot4 ? slot4Options.length : 0);
      summary.textContent=`${sourceLabel(source)} · ${type} · ${displayedCount} ${navLabel('options displayed','options affichées')} / ${totalCount}`;

      if(!tiers.length){
        output.innerHTML=`<div class="empty">${t('noResults')}</div>`;
        return;
      }

      const slotWidth = tiers.length >= 4 ? 245 : 285;
      output.innerHTML=`<div style="width:100%;overflow-x:auto;padding:4px 0 12px">
        <div style="display:grid;grid-template-columns:repeat(${tiers.length},minmax(${slotWidth}px,1fr));gap:14px;min-width:${tiers.length*slotWidth}px;align-items:start">
          ${tiers.map(tier=>{
            const tierRows=rows.filter(r=>r[1]===tier);
            const isSlot4=slotNumber(tier)===4;

            if(isSlot4){
              return `<section style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.04)">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--accent);color:white">
                  <strong style="font-size:.9rem;letter-spacing:.02em">${esc(tier)}</strong>
                  <span class="badge unverified" style="background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.45)">${navLabel('To verify','À vérifier')}</span>
                </div>
                <div style="padding:10px 12px;border-bottom:1px solid var(--line-soft);font-size:.75rem;color:var(--text-soft);line-height:1.4">
                  ${navLabel(
                    'Slot 4 on weapons and armor can roll an element or Unbreakable. The exact rules still need verification.',
                    'Le Slot 4 des armes et des armures peut obtenir un élément ou Unbreakable. Les règles exactes restent à vérifier.'
                  )}
                </div>
                <table style="width:100%;border-collapse:collapse;font-size:.8rem;table-layout:fixed">
                  <thead><tr>
                    <th style="text-align:left;padding:8px 9px">${navLabel('Possible option','Option possible')}</th>
                  </tr></thead>
                  <tbody>${slot4Matches.map((option,index)=>`<tr style="${index<slot4Matches.length-1?'border-bottom:1px solid var(--line-soft)':''}">
                    <th style="text-align:left;padding:8px 10px;font-weight:600">${esc(option)}</th>
                  </tr>`).join('')}</tbody>
                </table>
              </section>`;
            }

            return `<section style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.04)">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--accent);color:white">
                <strong style="font-size:.9rem;letter-spacing:.02em">${esc(tier)}</strong>
                <span style="font-size:.72rem;font-weight:700;opacity:.9">${tierRows.length} ${navLabel('options','options')}</span>
              </div>
              <table style="width:100%;border-collapse:collapse;font-size:.78rem;table-layout:fixed">
                <thead><tr>
                  <th style="text-align:left;padding:8px 9px;width:auto">${navLabel('Affix','Affixe')}</th>
                  <th style="width:54px;text-align:center;padding:8px 4px">Min</th>
                  <th style="width:54px;text-align:center;padding:8px 4px">Max</th>
                </tr></thead>
                <tbody>${tierRows.map((r,index)=>`<tr style="${index<tierRows.length-1?'border-bottom:1px solid var(--line-soft)':''}">
                  <th style="text-align:left;padding:7px 9px;font-weight:600;line-height:1.25;overflow-wrap:anywhere">${esc(r[2])}</th>
                  <td style="text-align:center;padding:7px 4px;font-weight:700;white-space:nowrap">${esc(r[3])}</td>
                  <td style="text-align:center;padding:7px 4px;font-weight:700;white-space:nowrap">${esc(r[4])}</td>
                </tr>`).join('')}</tbody>
              </table>
            </section>`;
          }).join('')}
        </div>
      </div>`;
    };

    sourceSelect.addEventListener('change',()=>{populateTypes();refresh();});
    typeSelect.addEventListener('change',refresh);
    search.addEventListener('input',refresh);
    populateTypes();
    refresh();
  }

      <h2 id="overview">${navLabel('Overview','Aperçu')}</h2>
      <p>${navLabel(
        'Auto-Hunt is configured from its own panel. The system is designed around several independent tabs, so combat behavior, target selection, survival rules, loot and consumables can all be adjusted separately.',
        'Auto-Hunt se configure depuis sa propre fenêtre. Le système est organisé en plusieurs onglets indépendants afin de régler séparément le comportement en combat, les cibles, les règles de survie, le loot et les consommables.'
      )}</p>
      <div class="wiki-feature-list">
        <div><strong>${miniIcon('monster')}${navLabel('Targets','Cibles')}</strong><p>${navLabel(
          'Choose which monsters Auto-Hunt is allowed to attack.',
          'Choisis les monstres qu’Auto-Hunt est autorisé à attaquer.'
        )}</p></div>
        <div><strong>${miniIcon('skill')}${navLabel('Skills','Compétences')}</strong><p>${navLabel(
          'Configure the skills used automatically and their intervals.',
          'Configure les compétences utilisées automatiquement et leurs intervalles.'
        )}</p></div>
        <div><strong>${miniIcon('item')}${navLabel('Loot','Butin')}</strong><p>${navLabel(
          'Filter the categories of items that the character should pick up.',
          'Filtre les catégories d’objets que le personnage doit ramasser.'
        )}</p></div>
        <div><strong>${miniIcon('tools')}${navLabel('Survival','Survie')}</strong><p>${navLabel(
          'Teleport, potion and resurrection rules can be configured to reduce the risk of dying.',
          'Des règles de téléportation, de potions et de résurrection peuvent être configurées pour réduire les risques de mort.'
        )}</p></div>
      </div>

      <h2 id="activation" style="display:flex;align-items:center;gap:9px"><img src="https://midgardhub.com/images/guides/new-player/image75.png" alt="" width="34" height="34" loading="lazy" style="width:34px;height:34px;object-fit:contain">${navLabel('Activating Auto-Hunt','Activer Auto-Hunt')}</h2>
      <p>${navLabel(
        'After configuring the panel, use the crossed-swords Auto-Hunt button. The swords turn blue while Auto-Hunt is active and the character begins hunting according to the saved settings. A keyboard shortcut can also be assigned in Game Settings to toggle Auto-Hunt on or off.',
        'Après avoir configuré la fenêtre, utilise le bouton Auto-Hunt représenté par deux épées croisées. Les épées deviennent bleues lorsque l’Auto-Hunt est actif et le personnage commence à chasser selon les réglages enregistrés. Un raccourci clavier peut aussi être attribué dans les Game Settings pour activer ou désactiver Auto-Hunt.'
      )}</p>

      <h2 id="basic">${navLabel('Basic settings','Réglages Basic')}</h2>
      <p>${navLabel(
        'The Basic tab contains the main safety conditions used to decide when the character should teleport away instead of continuing the fight.',
        'L’onglet Basic contient les principales conditions de sécurité permettant de décider quand le personnage doit se téléporter au lieu de continuer le combat.'
      )}</p>
      <div class="table-wrap"><table>
        <thead><tr><th>${navLabel('Setting','Réglage')}</th><th>${navLabel('Behavior','Comportement')}</th></tr></thead>
        <tbody>
          <tr><th>${navLabel('No-combat timer','Temps sans combat')}</th><td>${navLabel('Teleports after the configured time without engaging a monster.','Téléporte le personnage après la durée configurée sans engager de monstre.')}</td></tr>
          <tr><th>${navLabel('Visible monster count','Nombre de monstres visibles')}</th><td>${navLabel('Teleports when the number of monsters on screen reaches the configured danger threshold.','Téléporte le personnage lorsque le nombre de monstres visibles atteint le seuil de danger configuré.')}</td></tr>
          <tr><th>${navLabel('Damage threshold','Seuil de dégâts')}</th><td>${navLabel('Teleports when a single received hit reaches the configured percentage of Max HP.','Téléporte le personnage lorsqu’un coup reçu atteint le pourcentage de Max HP configuré.')}</td></tr>
          <tr><th>${navLabel('Resurrection item','Objet de résurrection')}</th><td>${navLabel('Can automatically use a resurrection item, with a configurable use limit.','Peut utiliser automatiquement un objet de résurrection, avec une limite d’utilisation configurable.')}</td></tr>
        </tbody>
      </table></div>
      <p>${navLabel(
        'Several safety triggers can be enabled at the same time. The Basic tab also contains PvP-specific behavior such as counterattack and kill-steal handling.',
        'Plusieurs conditions de sécurité peuvent être activées en même temps. L’onglet Basic contient également des comportements spécifiques au PvP, notamment la contre-attaque et la gestion du kill-steal.'
      )}</p>

      <h2 id="monsters">${navLabel('Monster settings','Réglages Monsters')}</h2>
      <p>${navLabel(
        'The Monsters tab controls which monster types the character will attack. Monsters can be selected or excluded so Auto-Hunt does not waste time or resources on unwanted targets.',
        'L’onglet Monsters détermine quels types de monstres le personnage va attaquer. Les monstres peuvent être sélectionnés ou exclus afin qu’Auto-Hunt ne perde pas de temps ou de ressources sur des cibles indésirables.'
      )}</p>
      <div class="wiki-callout warning-lite"><strong>${navLabel('Reset after changing map or channel','Réinitialisation après un changement de map ou de channel')}</strong><br>${navLabel(
        'The Monsters selection resets when changing map, including a channel change on the same map. Recheck this tab before restarting Auto-Hunt.',
        'La sélection de l’onglet Monsters est réinitialisée lors d’un changement de map, y compris lors d’un changement de channel sur la même map. Vérifie de nouveau cet onglet avant de relancer Auto-Hunt.'
      )}</div>

      <h2 id="skills">${navLabel('Skill settings','Réglages Skills')}</h2>
      <p>${navLabel(
        'The Skills tab defines the automatic attack rotation. Several skills can be registered, including different levels of the same skill, and each entry can use its own interval. The Skills tab contains three pages of slots.',
        'L’onglet Skills définit la rotation d’attaque automatique. Plusieurs compétences peuvent être enregistrées, y compris différents niveaux d’une même compétence, et chaque entrée peut avoir son propre intervalle. L’onglet Skills possède trois pages d’emplacements.'
      )}</p>
      <ul>
        <li>${navLabel(
          'Shorter intervals make a skill available again sooner, while longer intervals can be used for follow-up attacks.',
          'Un intervalle plus court rend une compétence disponible plus rapidement, tandis qu’un intervalle plus long peut servir pour une attaque de suivi.'
        )}</li>
        <li>${navLabel(
          'Ground-targeted skills such as Firewall cannot be aimed at a monster target by Auto-Hunt in the same way as targetable skills.',
          'Les compétences ciblant le sol, comme Firewall, ne peuvent pas être dirigées automatiquement sur un monstre de la même manière qu’une compétence ciblable.'
        )}</li>
        <li>${navLabel(
          'If Normal Attack is disabled but no skill is registered, the character falls back to normal attacks. A skill-only setup therefore needs at least one skill in the rotation.',
          'Si Normal Attack est désactivé mais qu’aucune compétence n’est enregistrée, le personnage revient aux attaques normales. Une configuration utilisant uniquement des compétences doit donc contenir au moins une compétence.'
        )}</li>
      </ul>

      <h2 id="loot">${navLabel('Loot settings','Réglages Loot')}</h2>
      <p>${navLabel(
        'The Loot tab controls what the character picks up. Loot can be filtered by item category, including weapons, armor, cards, costumes, consumables and miscellaneous items. A weight limit can also be used so Auto-Hunt stops adding loot before the character becomes overloaded.',
        'L’onglet Loot contrôle ce que le personnage ramasse. Le butin peut être filtré par catégorie d’objet, notamment armes, armures, cartes, costumes, consommables et objets divers. Une limite de poids peut également être utilisée afin qu’Auto-Hunt évite de continuer à charger l’inventaire jusqu’à la surcharge.'
      )}</p>

      <h2 id="items-potions">${navLabel('Items and Potions','Items et Potions')}</h2>
      <p>${navLabel(
        'The Potion tab handles automatic HP/SP recovery. Different recovery items can be assigned to different HP or SP percentage thresholds. The Item tab is used for other automatic consumables and buffs.',
        'L’onglet Potion gère automatiquement la récupération des HP/SP. Différents objets de récupération peuvent être associés à différents seuils de pourcentage de HP ou de SP. L’onglet Item sert aux autres consommables et buffs automatiques.'
      )}</p>
      <div class="wiki-feature-list">
        <div><strong>${miniIcon('item')}${navLabel('Potions','Potions')}</strong><p>${navLabel(
          'Several healing items can be configured at different HP/SP thresholds.',
          'Plusieurs objets de soin peuvent être configurés avec des seuils de HP/SP différents.'
        )}</p></div>
        <div><strong>${miniIcon('item')}${navLabel('Buff items','Objets de buff')}</strong><p>${navLabel(
          'Buff consumables are used again after their current effect expires.',
