<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ragnarok Zero Wiki — Admin</title>
  <style>
    :root{--bg:#eef2f5;--paper:#fff;--line:#c8ccd1;--text:#202122;--muted:#72777d;--blue:#3366cc;--blue2:#2a4b8d;--green:#18864b;--red:#b32424}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
    .login{max-width:440px;margin:80px auto}.grid{display:grid;grid-template-columns:220px 1fr;gap:18px}.nav button{width:100%;text-align:left;margin:0 0 8px}
    button,.btn{border:1px solid #a2a9b1;background:#f8f9fa;padding:9px 12px;border-radius:4px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:#fff;border-color:var(--blue2)}
    input,textarea,select{width:100%;padding:9px 10px;border:1px solid #a2a9b1;border-radius:4px;background:#fff;font:inherit} textarea{min-height:140px;resize:vertical}
    label{display:block;font-weight:700;margin:12px 0 5px}.muted{color:var(--muted)} .hidden{display:none!important}.status{padding:10px 12px;border-radius:4px;margin:10px 0;background:#f8f9fa;border:1px solid var(--line)}
    .error{color:var(--red)} .ok{color:var(--green)} table{width:100%;border-collapse:collapse;margin-top:12px} th,td{border-bottom:1px solid #eaecf0;padding:9px;text-align:left;vertical-align:top} th{background:#f8f9fa}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:300px}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:15px}}
  </style>
</head>
<body>
  <div class="wrap">
    <section id="loginView" class="card login">
      <h1>Ragnarok Zero Wiki</h1>
      <p class="muted">Administration</p>
      <div id="configWarning" class="status hidden"></div>
      <label for="email">Email</label><input id="email" type="email" autocomplete="username" />
      <label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" />
      <div style="margin-top:16px"><button id="loginBtn" class="primary">Se connecter</button></div>
      <div id="loginStatus" class="status hidden"></div>
    </section>

    <section id="adminView" class="hidden">
      <div class="top"><div><h1>Administration</h1><div id="whoami" class="muted"></div></div><div class="toolbar"><a class="btn" href="../">Voir le wiki</a><button id="logoutBtn">Déconnexion</button></div></div>
      <div class="grid">
        <aside class="card nav">
          <button data-tab="pages">Pages</button>
          <button data-tab="items">Items</button>
          <button data-tab="monsters">Monsters</button>
          <button data-tab="skills">Skills</button>
        </aside>
        <main>
          <section class="card">
            <div class="toolbar"><strong id="sectionTitle">Pages</strong><input id="searchBox" placeholder="Rechercher…" /><button id="newBtn" class="primary">Ajouter</button><button id="refreshBtn">Actualiser</button></div>
            <div id="listStatus" class="status hidden"></div>
            <div style="overflow:auto"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
          </section>
          <section id="editorCard" class="card hidden" style="margin-top:18px">
            <div class="toolbar"><strong id="editorTitle">Modifier</strong><button id="cancelBtn">Fermer</button></div>
            <form id="entityForm"></form>
            <div class="toolbar" style="margin-top:16px"><button id="saveBtn" class="primary" type="button">Enregistrer</button><button id="deleteBtn" type="button">Supprimer</button></div>
            <div id="editStatus" class="status hidden"></div>
          </section>
        </main>
      </div>
    </section>
  </div>

  <script src="../assets/supabase-config.js"></script>
  <script type="module" src="./admin.js"></script>
</body>
</html>
